name: Local Talk Cleanup Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup-test:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/322452775254/locations/global/workloadIdentityPools/local-talk-github-test/providers/github-actions'
          service_account: 'local-talk-cleanup-test@local-talk-test-93910.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform'
          create_credentials_file: false

      - name: Check access token
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          if [ -n "$ACCESS_TOKEN" ]; then
            echo "Google Cloud access token issued successfully."
            echo "No Firebase requests made."
            echo "No data deleted."
          else
            echo "Access token was not issued."
            exit 1
          fi
