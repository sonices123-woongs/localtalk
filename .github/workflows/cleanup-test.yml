
name: Local Talk Cleanup Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup-test:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/322452775254/locations/global/workloadIdentityPools/local-talk-github-test/providers/github-actions'
          service_account: 'local-talk-cleanup-test@local-talk-test-93910.iam.gserviceaccount.com'
          token_format: access_token

      - name: Read Firebase report counts
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          database = "https://local-talk-test-93910-default-rtdb.firebaseio.com"
          token = os.environ["ACCESS_TOKEN"]

          paths = [
              "communityReports",
              "communityReportStatuses",
              "moderationLogs"
          ]

          for path in paths:
              url = f"{database}/{path}.json?shallow=true"
              request = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}"}
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)

              count = len(data) if isinstance(data, dict) else 0
              print(f"{path}: {count} records")

          print("Read-only test completed. No data deleted.")
          PY
