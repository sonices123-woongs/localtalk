
name: Local Talk Cleanup Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup-test:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/322452775254/locations/global/workloadIdentityPools/local-talk-github-test/providers/github-actions'
          service_account: 'local-talk-cleanup-test@local-talk-test-93910.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email'
          create_credentials_file: false

      - name: Verify cleanup safety checks
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          DATABASE = "https://local-talk-test-93910-default-rtdb.firebaseio.com"
          TOKEN = os.environ["ACCESS_TOKEN"]

          ROOT = "cleanupTestData"
          CUTOFF_MS = int(time.time() * 1000) - 90 * 24 * 60 * 60 * 1000

          EXPECTED_REPORT = "test_old_processed"
          EXPECTED_LOG = "test_old_log"

          url = f"{DATABASE}/{ROOT}.json"
          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {TOKEN}"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          if not isinstance(data, dict):
              raise SystemExit("FAIL: Test data missing.")

          reports = data.get("reports")
          statuses = data.get("statuses")
          logs = data.get("logs")

          if not all(isinstance(x, dict) for x in (reports, statuses, logs)):
              raise SystemExit("FAIL: Invalid data structure.")

          def is_old(value):
              return (
                  isinstance(value, (int, float))
                  and not isinstance(value, bool)
                  and value > 0
                  and value < CUTOFF_MS
              )

          report_candidates = set()

          for report_id, report in reports.items():
              status = statuses.get(report_id)

              if (
                  isinstance(report, dict)
                  and isinstance(status, dict)
                  and status.get("action") == "reviewed"
                  and is_old(status.get("createdAt"))
              ):
                  report_candidates.add(report_id)

          log_candidates = {
              log_id
              for log_id, log in logs.items()
              if isinstance(log, dict) and is_old(log.get("createdAt"))
          }

          if report_candidates != {EXPECTED_REPORT}:
              raise SystemExit("FAIL: Unexpected report candidates.")

          if log_candidates != {EXPECTED_LOG}:
              raise SystemExit("FAIL: Unexpected log candidates.")

          if "test_recent_processed" not in reports:
              raise SystemExit("FAIL: Recent report missing.")

          if "test_recent_processed" not in statuses:
              raise SystemExit("FAIL: Recent status missing.")

          if "test_old_pending" not in reports:
              raise SystemExit("FAIL: Pending report missing.")

          if "test_old_pending" in statuses:
              raise SystemExit("FAIL: Pending report has a status.")

          allowed_paths = {
              f"{ROOT}/reports/{EXPECTED_REPORT}",
              f"{ROOT}/statuses/{EXPECTED_REPORT}",
              f"{ROOT}/logs/{EXPECTED_LOG}"
          }

          expected_paths = {
              "cleanupTestData/reports/test_old_processed",
              "cleanupTestData/statuses/test_old_processed",
              "cleanupTestData/logs/test_old_log"
          }

          if allowed_paths != expected_paths:
              raise SystemExit("FAIL: Unexpected deletion paths.")

          print("=== Cleanup safety verification ===")

          for path in sorted(allowed_paths):
              print(f"ALLOWED TEST PATH: {path}")

          print("PASS: Only expected old records selected.")
          print("PASS: Recent and pending reports protected.")
          print("PASS: Deletion paths restricted to cleanupTestData.")
          print("READ-ONLY SAFETY CHECK. No data deleted.")
          PY
