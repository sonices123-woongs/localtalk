
name: Local Talk Cleanup Test

on:
  workflow_dispatch:
    inputs:
      confirm_test_delete:
        description: 'Type DELETE_TEST_DATA to allow test deletion'
        required: true
        default: 'NO'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  cleanup-test:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/322452775254/locations/global/workloadIdentityPools/local-talk-github-test/providers/github-actions'
          service_account: 'local-talk-cleanup-test@local-talk-test-93910.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email'
          create_credentials_file: false

      - name: Verify and optionally delete isolated test data
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONFIRM_DELETE: ${{ inputs.confirm_test_delete }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          DATABASE = "https://local-talk-test-93910-default-rtdb.firebaseio.com"
          ROOT = "cleanupTestData"
          TOKEN = os.environ["ACCESS_TOKEN"]
          CONFIRM = os.environ.get("CONFIRM_DELETE", "NO")

          CUTOFF_MS = int(time.time() * 1000) - 90 * 24 * 60 * 60 * 1000

          EXPECTED_REPORT = "test_old_processed"
          EXPECTED_LOG = "test_old_log"

          def firebase_request(path, method="GET"):
              if not path.startswith(ROOT + "/") and path != ROOT:
                  raise SystemExit("BLOCKED: Path outside test area.")

              url = f"{DATABASE}/{path}.json"
              request = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {TOKEN}"},
                  method=method
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  if method == "GET":
                      return json.load(response)
                  return None

          data = firebase_request(ROOT)

          if not isinstance(data, dict):
              raise SystemExit("FAIL: Test data missing.")

          reports = data.get("reports")
          statuses = data.get("statuses")
          logs = data.get("logs")

          if not all(isinstance(x, dict) for x in (reports, statuses, logs)):
              raise SystemExit("FAIL: Invalid data structure.")

          def is_old(value):
              return (
                  isinstance(value, (int, float))
                  and not isinstance(value, bool)
                  and value > 0
                  and value < CUTOFF_MS
              )

          report_candidates = {
              report_id
              for report_id, report in reports.items()
              if (
                  isinstance(report, dict)
                  and isinstance(statuses.get(report_id), dict)
                  and statuses[report_id].get("action") == "reviewed"
                  and is_old(statuses[report_id].get("createdAt"))
              )
          }

          log_candidates = {
              log_id
              for log_id, log in logs.items()
              if isinstance(log, dict) and is_old(log.get("createdAt"))
          }

          if report_candidates != {EXPECTED_REPORT}:
              raise SystemExit("FAIL: Unexpected report candidates.")

          if log_candidates != {EXPECTED_LOG}:
              raise SystemExit("FAIL: Unexpected log candidates.")

          if "test_recent_processed" not in reports:
              raise SystemExit("FAIL: Recent report missing.")

          if "test_recent_processed" not in statuses:
              raise SystemExit("FAIL: Recent status missing.")

          if "test_old_pending" not in reports:
              raise SystemExit("FAIL: Pending report missing.")

          if "test_old_pending" in statuses:
              raise SystemExit("FAIL: Pending report has a status.")

          paths = [
              f"{ROOT}/reports/{EXPECTED_REPORT}",
              f"{ROOT}/statuses/{EXPECTED_REPORT}",
              f"{ROOT}/logs/{EXPECTED_LOG}"
          ]

          print("=== Test deletion safety check ===")

          for path in paths:
              print(f"TARGET: {path}")

          print("PASS: Exact test records verified.")

          if CONFIRM != "DELETE_TEST_DATA":
              print("DRY RUN ONLY. No data deleted.")
              raise SystemExit(0)

          print("Confirmed test deletion. Starting...")

          for path in paths:
              firebase_request(path, method="DELETE")
              print(f"DELETED: {path}")

          remaining = firebase_request(ROOT)

          if not isinstance(remaining, dict):
              raise SystemExit("FAIL: Test root missing after deletion.")

          remaining_reports = remaining.get("reports", {})
          remaining_statuses = remaining.get("statuses", {})
          remaining_logs = remaining.get("logs", {})

          if EXPECTED_REPORT in remaining_reports:
              raise SystemExit("FAIL: Old report still exists.")

          if EXPECTED_REPORT in remaining_statuses:
              raise SystemExit("FAIL: Old status still exists.")

          if EXPECTED_LOG in remaining_logs:
              raise SystemExit("FAIL: Old log still exists.")

          if "test_recent_processed" not in remaining_reports:
              raise SystemExit("FAIL: Recent report was removed.")

          if "test_recent_processed" not in remaining_statuses:
              raise SystemExit("FAIL: Recent status was removed.")

          if "test_old_pending" not in remaining_reports:
              raise SystemExit("FAIL: Pending report was removed.")

          print("PASS: Old test records deleted.")
          print("PASS: Recent and pending reports preserved.")
          print("TEST DELETION COMPLETED.")
          PY
