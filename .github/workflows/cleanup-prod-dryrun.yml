
name: Local Talk Production Cleanup Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup-check:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to production Firebase
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1088072869168/locations/global/workloadIdentityPools/local-talk-github-prod/providers/github-actions'
          service_account: 'local-talk-cleanup@local-talk-6c171.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email'
          create_credentials_file: false

      - name: Check production cleanup candidates
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          DATABASE = "https://local-talk-6c171-default-rtdb.firebaseio.com"
          TOKEN = os.environ["ACCESS_TOKEN"]
          CUTOFF = int(time.time() * 1000) - 90 * 24 * 60 * 60 * 1000

          def read(path):
              request = urllib.request.Request(
                  f"{DATABASE}/{path}.json",
                  headers={"Authorization": f"Bearer {TOKEN}"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              return data if isinstance(data, dict) else {}

          reports = read("communityReports")
          statuses = read("communityReportStatuses")
          logs = read("moderationLogs")

          def old(timestamp):
              return (
                  isinstance(timestamp, (int, float))
                  and not isinstance(timestamp, bool)
                  and 0 < timestamp < CUTOFF
              )

          report_ids = [
              report_id
              for report_id, report in reports.items()
              if (
                  isinstance(report, dict)
                  and isinstance(statuses.get(report_id), dict)
                  and statuses[report_id].get("action") in ("reviewed", "deleted")
                  and old(statuses[report_id].get("createdAt"))
              )
          ]

          log_ids = [
              log_id
              for log_id, log in logs.items()
              if isinstance(log, dict) and old(log.get("createdAt"))
          ]

          print("=== Local Talk Production 90-day cleanup check ===")
          print(f"Processed reports older than 90 days: {len(report_ids)}")
          print(f"Moderation logs older than 90 days: {len(log_ids)}")
          print("DRY RUN ONLY: No records deleted.")
          PY
