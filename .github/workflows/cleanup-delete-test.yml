
name: Local Talk 90-Day Delete Test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_FIXTURE_TEST to run TEST-only deletion"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: localtalk-90day-fixture-test
  cancel-in-progress: false

jobs:
  delete-test:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to TEST Firebase
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/322452775254/locations/global/workloadIdentityPools/local-talk-github-test/providers/github-actions'
          service_account: 'local-talk-cleanup-test@local-talk-test-93910.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email'
          create_credentials_file: false

      - name: Run TEST-only retention fixture verification
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import uuid
          import urllib.request
          import urllib.error

          DATABASE = "https://local-talk-test-93910-default-rtdb.firebaseio.com"
          EXPECTED_HOST = "local-talk-test-93910-default-rtdb.firebaseio.com"
          CONFIRM_TEXT = "RUN_FIXTURE_TEST"
          RETENTION_DAYS = 90
          MAX_DELETE_NODES = 50

          token = os.environ["ACCESS_TOKEN"]

          if os.environ.get("CONFIRMATION") != CONFIRM_TEXT:
              raise RuntimeError("STOP: Confirmation mismatch.")

          if not DATABASE.startswith("https://"):
              raise RuntimeError("STOP: HTTPS required.")

          if DATABASE.split("/")[2] != EXPECTED_HOST:
              raise RuntimeError("STOP: Wrong Firebase database.")

          now_ms = int(time.time() * 1000)
          day_ms = 24 * 60 * 60 * 1000
          cutoff = now_ms - RETENTION_DAYS * day_ms

          # Unique IDs ensure existing reports are not reused.
          run_id = uuid.uuid4().hex[:16]
          prefix = f"cleanup_verify_{run_id}_"

          ids = {
              "old_reviewed": prefix + "old_reviewed",
              "old_deleted": prefix + "old_deleted",
              "recent_reviewed": prefix + "recent_reviewed",
              "old_pending": prefix + "old_pending",
              "old_log": prefix + "old_log",
              "recent_log": prefix + "recent_log",
          }

          old_ms = now_ms - 100 * day_ms
          recent_ms = now_ms - 10 * day_ms

          def api(method, path, data=None):
              if not (
                  path.startswith("communityReports/")
                  or path.startswith("communityReportStatuses/")
                  or path.startswith("moderationLogs/")
              ):
                  raise RuntimeError("STOP: Unapproved database path.")

              leaf = path.split("/")[-1]
              if not leaf.startswith(prefix):
                  raise RuntimeError("STOP: Not this run's fixture.")

              payload = (
                  None if data is None
                  else json.dumps(data).encode("utf-8")
              )

              request = urllib.request.Request(
                  f"{DATABASE}/{path}.json",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method=method,
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  result = response.read()

              if method == "GET":
                  return json.loads(result) if result else None

              return None

          def old(timestamp):
              return (
                  isinstance(timestamp, (int, float))
                  and not isinstance(timestamp, bool)
                  and 0 < timestamp < cutoff
              )

          def eligible(report, status):
              return (
                  isinstance(report, dict)
                  and isinstance(status, dict)
                  and status.get("action") in ("reviewed", "deleted")
                  and old(status.get("createdAt"))
              )

          # Every fixture is tracked for cleanup.
          created_paths = []

          def create(path, value):
              # Never overwrite existing data.
              if api("GET", path) is not None:
                  raise RuntimeError(
                      f"STOP: Fixture already exists: {path}"
                  )
              api("PUT", path, value)
              created_paths.append(path)

          def delete(path):
              api("DELETE", path)

          def verify_present(path):
              if api("GET", path) is None:
                  raise AssertionError(
                      f"Expected fixture to exist: {path}"
                  )

          def verify_absent(path):
              if api("GET", path) is not None:
                  raise AssertionError(
                      f"Expected fixture to be deleted: {path}"
                  )

          def report_payload(timestamp):
              return {
                  "kind": "post",
                  "cityId": "seoul",
                  "createdAt": timestamp,
                  "reason": "automated_retention_test",
                  "contentText": "TEST FIXTURE ONLY",
              }

          def status_payload(action, timestamp):
              return {
                  "action": action,
                  "createdAt": timestamp,
                  "adminUid": "automated_test",
              }

          report_cases = [
              ("old_reviewed", "reviewed", old_ms),
              ("old_deleted", "deleted", old_ms),
              ("recent_reviewed", "reviewed", recent_ms),
              ("old_pending", None, old_ms),
          ]

          all_paths = []

          for key, _, _ in report_cases:
              report_id = ids[key]
              all_paths.append(f"communityReports/{report_id}")
              if key != "old_pending":
                  all_paths.append(
                      f"communityReportStatuses/{report_id}"
                  )

          all_paths.extend([
              f"moderationLogs/{ids['old_log']}",
              f"moderationLogs/{ids['recent_log']}",
          ])

          print("=== Local Talk 90-Day TEST Fixture Verification ===")
          print("Database: TEST PROJECT ONLY")
          print(f"Fixture prefix: {prefix}")
          print("Existing user reports are outside this prefix.")

          try:
              # 1. Create synthetic reports in real app paths.
              for key, action, timestamp in report_cases:
                  report_id = ids[key]
                  create(
                      f"communityReports/{report_id}",
                      report_payload(timestamp),
                  )
                  if action is not None:
                      create(
                          f"communityReportStatuses/{report_id}",
                          status_payload(action, timestamp),
                      )

              create(
                  f"moderationLogs/{ids['old_log']}",
                  {"createdAt": old_ms, "type": "fixture"},
              )
              create(
                  f"moderationLogs/{ids['recent_log']}",
                  {"createdAt": recent_ms, "type": "fixture"},
              )

              # 2. Select eligible records from this run only.
              selected_reports = []
              for key, _, _ in report_cases:
                  report_id = ids[key]
                  report = api(
                      "GET", f"communityReports/{report_id}"
                  )
                  status = api(
                      "GET", f"communityReportStatuses/{report_id}"
                  )
                  if eligible(report, status):
                      selected_reports.append(report_id)

              selected_logs = []
              for key in ("old_log", "recent_log"):
                  log_id = ids[key]
                  log = api("GET", f"moderationLogs/{log_id}")
                  if isinstance(log, dict) and old(log.get("createdAt")):
                      selected_logs.append(log_id)

              expected_reports = {
                  ids["old_reviewed"],
                  ids["old_deleted"],
              }
              expected_logs = {ids["old_log"]}

              if set(selected_reports) != expected_reports:
                  raise AssertionError(
                      "STOP: Unexpected report deletion candidates."
                  )

              if set(selected_logs) != expected_logs:
                  raise AssertionError(
                      "STOP: Unexpected log deletion candidates."
                  )

              total_nodes = (
                  2 * len(selected_reports) + len(selected_logs)
              )

              if total_nodes > MAX_DELETE_NODES:
                  raise RuntimeError(
                      "STOP: Maximum deletion nodes exceeded."
                  )

              print(f"Selected old reports: {len(selected_reports)}")
              print(f"Selected old logs: {len(selected_logs)}")
              print(f"Selected database nodes: {total_nodes}")

              # 3. Recheck before deleting selected fixtures.
              for report_id in selected_reports:
                  report_path = f"communityReports/{report_id}"
                  status_path = (
                      f"communityReportStatuses/{report_id}"
                  )

                  if not eligible(
                      api("GET", report_path),
                      api("GET", status_path),
                  ):
                      raise RuntimeError(
                          "STOP: Report eligibility changed."
                      )

                  delete(report_path)
                  delete(status_path)

              for log_id in selected_logs:
                  log_path = f"moderationLogs/{log_id}"
                  log = api("GET", log_path)

                  if not (
                      isinstance(log, dict)
                      and old(log.get("createdAt"))
                  ):
                      raise RuntimeError(
                          "STOP: Log eligibility changed."
                      )

                  delete(log_path)

              # 4. Verify old records were deleted.
              for report_id in selected_reports:
                  verify_absent(f"communityReports/{report_id}")
                  verify_absent(
                      f"communityReportStatuses/{report_id}"
                  )

              for log_id in selected_logs:
                  verify_absent(f"moderationLogs/{log_id}")

              # 5. Verify recent/pending records survived.
              for key in ("recent_reviewed", "old_pending"):
                  verify_present(
                      f"communityReports/{ids[key]}"
                  )

              verify_present(
                  f"communityReportStatuses/{ids['recent_reviewed']}"
              )
              verify_present(
                  f"moderationLogs/{ids['recent_log']}"
              )

              print("PASS: Expired reviewed reports deleted.")
              print("PASS: Expired deleted-status reports deleted.")
              print("PASS: Recent reports preserved.")
              print("PASS: Pending reports preserved.")
              print("PASS: Expired moderation logs deleted.")
              print("PASS: Recent moderation logs preserved.")

          finally:
              # Remove all remaining fixtures from this run.
              # No pre-existing user data is in this list.
              cleanup_errors = []

              for path in reversed(created_paths):
                  try:
                      delete(path)
                  except Exception as error:
                      cleanup_errors.append(f"{path}: {error}")

              if cleanup_errors:
                  raise RuntimeError(
                      "Fixture cleanup incomplete: "
                      + "; ".join(cleanup_errors)
                  )

              print("PASS: Temporary test fixtures cleaned up.")

          print("SUCCESS: TEST-only deletion verification complete.")
          PY
