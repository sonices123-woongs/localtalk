
name: Local Talk Production Auth Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  auth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to production service account
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1088072869168/locations/global/workloadIdentityPools/local-talk-github-prod/providers/github-actions'
          service_account: 'local-talk-cleanup@local-talk-6c171.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email'
          create_credentials_file: false

      - name: Verify authentication
        shell: bash
        run: |
          echo "PASS: Production service account authentication succeeded."
          echo "No Firebase database requests were made."
          echo "No records were read, changed, or deleted."
