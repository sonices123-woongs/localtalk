
name: Local Talk 90-Day Cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to test Firebase
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/322452775254/locations/global/workloadIdentityPools/local-talk-github-test/providers/github-actions'
          service_account: 'local-talk-cleanup-test@local-talk-test-93910.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email'
          create_credentials_file: false

      - name: Verify 90-day cleanup candidates
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          # TEST FIREBASE ONLY
          DATABASE = "https://local-talk-test-93910-default-rtdb.firebaseio.com"
          TOKEN = os.environ["ACCESS_TOKEN"]

          DRY_RUN = True
          MAX_DELETE_RECORDS = 50
          RETENTION_DAYS = 90

          CUTOFF = (
              int(time.time() * 1000)
              - RETENTION_DAYS * 24 * 60 * 60 * 1000
          )

          EXPECTED_DATABASE = (
              "https://local-talk-test-93910-default-rtdb.firebaseio.com"
          )

          if DATABASE != EXPECTED_DATABASE:
              raise RuntimeError("STOP: Not the expected TEST database.")

          if not DRY_RUN:
              raise RuntimeError(
                  "STOP: Actual deletion is not enabled in this version."
              )

          def read(path):
              request = urllib.request.Request(
                  f"{DATABASE}/{path}.json",
                  headers={"Authorization": f"Bearer {TOKEN}"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)

              if data is None:
                  return {}

              if not isinstance(data, dict):
                  raise RuntimeError(
                      f"STOP: Unexpected database structure: {path}"
                  )

              return data

          def old(timestamp):
              return (
                  isinstance(timestamp, (int, float))
                  and not isinstance(timestamp, bool)
                  and 0 < timestamp < CUTOFF
              )

          # Synthetic tests: no Firebase writes or deletions.
          now_ms = int(time.time() * 1000)
          old_ms = now_ms - 100 * 24 * 60 * 60 * 1000
          recent_ms = now_ms - 10 * 24 * 60 * 60 * 1000

          def eligible(report, status):
              return (
                  isinstance(report, dict)
                  and isinstance(status, dict)
                  and status.get("action") in ("reviewed", "deleted")
                  and old(status.get("createdAt"))
              )

          # Old completed reports must qualify.
          assert eligible({}, {"action": "reviewed", "createdAt": old_ms})
          assert eligible({}, {"action": "deleted", "createdAt": old_ms})

          # Recent completed reports must be preserved.
          assert not eligible(
              {}, {"action": "reviewed", "createdAt": recent_ms}
          )

          # Pending reports must be preserved.
          assert not eligible({}, None)
          assert not eligible(
              {}, {"action": "pending", "createdAt": old_ms}
          )

          # Moderation logs use their own timestamps.
          assert old(old_ms)
          assert not old(recent_ms)

          print("PASS: Synthetic 90-day retention tests.")

          print("=== Local Talk 90-day cleanup ===")
          print("Database: TEST PROJECT")
          print(f"Retention: {RETENTION_DAYS} days")
          print(f"Dry run: {DRY_RUN}")

          reports = read("communityReports")
          statuses = read("communityReportStatuses")
          logs = read("moderationLogs")

          report_ids = [
              report_id
              for report_id, report in reports.items()
              if eligible(report, statuses.get(report_id))
          ]

          log_ids = [
              log_id
              for log_id, log in logs.items()
              if isinstance(log, dict) and old(log.get("createdAt"))
          ]

          # A report cleanup removes two nodes:
          # communityReports/{id}
          # communityReportStatuses/{id}
          total_nodes = 2 * len(report_ids) + len(log_ids)

          print(
              f"Processed reports older than 90 days: {len(report_ids)}"
          )
          print(
              f"Moderation logs older than 90 days: {len(log_ids)}"
          )
          print(f"Total candidate database nodes: {total_nodes}")
          print(f"Maximum allowed nodes: {MAX_DELETE_RECORDS}")

          if total_nodes > MAX_DELETE_RECORDS:
              raise RuntimeError(
                  "STOP: Candidate count exceeds the safety limit."
              )

          print("Safety checks passed.")
          print("DRY RUN ONLY: No records deleted.")
          PY
