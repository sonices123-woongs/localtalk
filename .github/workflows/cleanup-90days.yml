
name: Local Talk 90-Day Cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to test Firebase
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/322452775254/locations/global/workloadIdentityPools/local-talk-github-test/providers/github-actions'
          service_account: 'local-talk-cleanup-test@local-talk-test-93910.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: 'https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email'
          create_credentials_file: false

      - name: Verify 90-day cleanup candidates
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          DATABASE = "https://local-talk-test-93910-default-rtdb.firebaseio.com"
          TOKEN = os.environ["ACCESS_TOKEN"]

          DRY_RUN = True
          MAX_DELETE_RECORDS = 50
          RETENTION_DAYS = 90

          CUTOFF = (
              int(time.time() * 1000)
              - RETENTION_DAYS * 24 * 60 * 60 * 1000
          )

          # Never run this workflow against production.
          EXPECTED_DATABASE = (
              "https://local-talk-test-93910-default-rtdb.firebaseio.com"
          )

          if DATABASE != EXPECTED_DATABASE:
              raise RuntimeError("STOP: Not the expected TEST database.")

          if not DRY_RUN:
              raise RuntimeError(
                  "STOP: Actual deletion is not enabled in this version."
              )

          def read(path):
              request = urllib.request.Request(
                  f"{DATABASE}/{path}.json",
                  headers={"Authorization": f"Bearer {TOKEN}"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)

              if data is None:
                  return {}

              if not isinstance(data, dict):
                  raise RuntimeError(
                      f"STOP: Unexpected database structure: {path}"
                  )

              return data

          def old(timestamp):
              return (
                  isinstance(timestamp, (int, float))
                  and not isinstance(timestamp, bool)
                  and 0 < timestamp < CUTOFF
              )

          print("=== Local Talk 90-day cleanup ===")
          print("Database: TEST PROJECT")
          print(f"Retention: {RETENTION_DAYS} days")
          print(f"Dry run: {DRY_RUN}")

          reports = read("communityReports")
          statuses = read("communityReportStatuses")
          logs = read("moderationLogs")

          report_ids = []

          for report_id, report in reports.items():
              if not isinstance(report, dict):
                  continue

              status = statuses.get(report_id)

              # No administrator decision: preserve the report.
              if not isinstance(status, dict):
                  continue

              action = status.get("action")

              # Only completed administrator decisions qualify.
              if action not in ("reviewed", "deleted"):
                  continue

              # Use the administrator decision timestamp,
              # not the original report submission timestamp.
              processed_at = status.get("createdAt")

              if old(processed_at):
                  report_ids.append(report_id)

          log_ids = []

          for log_id, log in logs.items():
              if not isinstance(log, dict):
                  continue

              if old(log.get("createdAt")):
                  log_ids.append(log_id)

          # Count actual database nodes, not just report IDs.
          # Each report cleanup would remove its report and status.
          total_nodes = 2 * len(report_ids) + len(log_ids)

          print(
              f"Processed reports older than 90 days: {len(report_ids)}"
          )
          print(
              f"Moderation logs older than 90 days: {len(log_ids)}"
          )
          print(f"Total candidate database nodes: {total_nodes}")
          print(f"Maximum allowed nodes: {MAX_DELETE_RECORDS}")

          if total_nodes > MAX_DELETE_RECORDS:
              raise RuntimeError(
                  "STOP: Candidate count exceeds the safety limit."
              )

          print("Safety checks passed.")
          print("DRY RUN ONLY: No records deleted.")
          PY
