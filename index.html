  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 900px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 640px) {
      .app-container {
        max-width: 100% !important;
        max-height: 100% !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
    }

    .scroll-area {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    .chat-bubble { 
      word-break: break-all !important; 
      overflow-wrap: anywhere !important; 
    }

  <div class="app-container sm:rounded-[36px] border-slate-700 sm:border-[8px]">

    <!-- 1. 상단 헤더 -->
    <header class="bg-indigo-600 text-white px-3.5 py-3 shrink-0 flex justify-between items-center shadow-md w-full z-50">
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <button id="backBtn" onclick="goBack()" class="hidden text-white hover:text-indigo-200 text-lg pr-1 shrink-0">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="min-w-0 flex-1">
          <h1 id="headerTitle" class="text-sm sm:text-base font-bold flex items-center gap-1.5 truncate">
            <svg class="w-4 h-5 fill-indigo-200 shrink-0" viewBox="0 0 100 140">
              <path d="M40,5 Q55,8 60,18 Q68,28 62,38 Q58,45 68,52 Q78,60 70,72 Q62,82 65,95 Q68,110 52,125 Q42,135 38,128 Q32,118 38,102 Q42,92 35,82 Q28,72 32,58 Q35,48 25,35 Q18,25 28,15 Z"/>
              <circle cx="82" cy="118" r="5"/>
              <circle cx="92" cy="55" r="3"/>
            </svg>
            <span class="truncate">Korea Local Talk</span>
          </h1>
          <p id="headerSub" class="text-[10px] text-indigo-100 truncate">대한민국 실시간 현지인 Q&A</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1 shrink-0 ml-1">
        <button id="refreshBtn" onclick="loadMessages()" class="hidden bg-indigo-700 hover:bg-indigo-800 text-white p-1.5 rounded-full text-xs font-bold items-center justify-center mr-0.5">
          <i class="fas fa-sync-alt text-[10px]" id="refreshIcon"></i>
        </button>
        <span class="text-[10px] text-indigo-200 font-bold">Language:</span>
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-indigo-700 text-white text-[10px] font-bold py-1 px-1.5 rounded-full border border-indigo-500 focus:outline-none cursor-pointer">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh-CN">中文</option>
        </select>
      </div>
    </header>

    <!-- [화면 1] 도시 선택 메인 화면 -->
    <main id="homeView" class="p-4 space-y-3.5 flex-1 scroll-area w-full pb-16">
      <div class="relative w-full">
        <i class="fas fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="citySearch" onkeyup="filterCities()" placeholder="궁금한 도시를 검색하세요 (예: 서울, 제주, 대구)" class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
      </div>

      <div class="w-full">
        <h2 id="popularTitle" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">대한민국 주요 도시 목록</h2>
        <div id="cityList" class="grid grid-cols-2 gap-2.5 w-full"></div>
      </div>
    </main>

    <!-- [화면 2] 지역 게시판 메인 화면 -->
    <main id="boardView" class="hidden p-4 space-y-3.5 flex-1 scroll-area w-full pb-16">
      <div onclick="openChatRoomList()" class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-3.5 rounded-2xl shadow-md cursor-pointer flex justify-between items-center hover:opacity-95 transition">
        <div>
          <span class="bg-white/20 text-[10px] px-2 py-0.5 rounded-full font-bold">LIVE Q&A (Max 4명)</span>
          <h3 id="boardBannerTitle" class="font-bold text-sm mt-1">실시간 대화방 목록</h3>
          <p id="boardBannerSub" class="text-[11px] text-indigo-100 mt-0.5">원하는 채팅방을 선택하여 소통해보세요</p>
        </div>
        <div class="bg-white text-indigo-600 w-9 h-9 rounded-full flex items-center justify-center text-sm shadow shrink-0">
          <i class="fas fa-comments"></i>
        </div>
      </div>

      <div>
        <h3 id="boardPostsTitle" class="text-xs font-bold text-slate-600 mb-2 flex items-center gap-1">
          <i class="fas fa-bullhorn text-amber-500"></i> 필독 정보 & 지역 꿀팁
        </h3>
        <div id="boardPosts" class="space-y-2"></div>
      </div>
    </main>

    <!-- [화면 3] 도시별 5개 채팅방 선택 화면 -->
    <main id="roomListView" class="hidden p-4 space-y-3.5 flex-1 scroll-area w-full pb-16">
      <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 text-xs text-indigo-800 flex items-center gap-2">
        <i class="fas fa-users text-indigo-500"></i>
        <div>
          <strong id="roomListNoticeTitle">실시간 Q&A 대화방 선택</strong>
          <p id="roomListNoticeSub" class="text-[10px] text-indigo-600">쾌적한 대화를 위해 각 방당 최대 4명까지 입장 가능합니다.</p>
        </div>
      </div>

      <div id="chatRoomsContainer" class="space-y-2.5 w-full"></div>
    </main>

    <!-- [화면 4] 개별 채팅방 화면 -->
    <div id="chatView" class="hidden flex-1 flex-col overflow-hidden w-full relative bg-slate-50 pb-12">
      <main class="flex-1 p-3.5 space-y-3 scroll-area w-full pb-4" id="chatScrollArea">
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 text-xs text-indigo-800 flex items-start gap-2 w-full">
          <i class="fas fa-info-circle text-indigo-500 mt-0.5 shrink-0 text-xs"></i>
          <div class="min-w-0 flex-1">
            <strong id="chatNoticeTitle" class="text-xs">현지인 Q&A 방</strong><br>
            <span id="chatNoticeSub" class="text-[11px]">여행 중 궁금한 점을 물어보세요! 현지 주민들이 답해드립니다.</span>
          </div>
        </div>

        <div id="messageList" class="space-y-3 w-full"></div>
      </main>

      <footer id="chatInputBar" class="bg-white border-t border-slate-200 px-3 py-2 flex gap-2 items-center shrink-0 z-40 w-full">
        <input type="text" id="msgInput" onkeypress="if(event.key==='Enter') sendMessage()" placeholder="질문이나 답변을 입력하세요..." class="flex-1 min-w-0 bg-slate-100 border-none rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button id="sendBtn" onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl font-bold text-xs flex items-center justify-center transition shadow-sm whitespace-nowrap shrink-0">
          전송
        </button>
      </footer>
    </div>

    <!-- [화면 5] 구글 지도 화면 -->
    <main id="mapView" class="hidden flex-1 w-full h-full relative pb-12">
      <div class="absolute top-3 left-3 right-3 z-50 flex flex-col gap-1.5">
        <div class="flex gap-1.5">
          <input type="text" id="mapSearchInput" onkeypress="if(event.key==='Enter') searchGoogleMapLocation()" placeholder="장소(예: 현대, 더현대 대구)" class="flex-1 px-3.5 py-2 bg-white/95 backdrop-blur border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-md">
          <button onclick="searchGoogleMapLocation()" class="bg-indigo-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-md hover:bg-indigo-700 shrink-0">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>

      <div id="googleMap" class="w-full h-full min-h-[300px]"></div>
      
      <!-- 내 위치 찾기 버튼 -->
      <button onclick="moveToMyLocation(true)" class="absolute bottom-16 right-4 bg-white text-slate-700 p-3 rounded-full shadow-lg z-50 hover:bg-slate-50 flex items-center justify-center border border-slate-200">
        <i class="fas fa-crosshairs text-indigo-600 text-base"></i>
      </button>
    </main>

    <!-- 하단 탭 바 (Bottom Navigation) -->
    <nav class="bg-white border-t border-slate-200 px-6 py-2 flex justify-between items-center shrink-0 z-50 w-full">
      <button onclick="switchTab('home')" id="tabHome" class="flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition">
        <i class="fas fa-house text-base"></i>
        <span class="text-[10px]">홈</span>
      </button>
      <button onclick="switchTab('map')" id="tabMap" class="flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition">
        <i class="fas fa-map-location-dot text-base"></i>
        <span class="text-[10px]">지역지도</span>
      </button>
      <button onclick="switchTab('my')" id="tabMy" class="flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition">
        <i class="fas fa-user text-base"></i>
        <span class="text-[10px]">My</span>
      </button>
    </nav>

  </div>

    function loadGoogleMapsScript(langCode, callback) {
      var existingScript = document.getElementById("googleMapsScript");
      if (existingScript) {
        existingScript.remove();
      }
      delete window.google;

      var script = document.createElement("script");
      script.id = "googleMapsScript";
      script.src = "https://maps.googleapis.com/maps/api/js?key=" + googleApiKey + "&libraries=places&language=" + langCode;
      script.async = true;
      script.defer = true;
      script.onload = function() {
        if (callback) callback();
      };
      document.head.appendChild(script);
    }

    function listenCityUsers() {
      var presenceRef = db.ref('presence');
      presenceRef.on('value', function(snapshot) {
        var data = snapshot.val() || {};
        var counts = {};

        for (var key in data) {
          var userObj = data[key];
          if (userObj && userObj.cityId) {
            counts[userObj.cityId] = (counts[userObj.cityId] || 0) + 1;
          }
        }
        renderCityList(document.getElementById('citySearch').value, counts);
      });
    }

    function renderCityList(filterKeyword, liveCounts) {

      var listContainer = document.getElementById('cityList');

      listContainer.innerHTML = '';
      var t = I18N[currentLang] || I18N['ko'];

      for (var i = 0; i < CITIES.length; i++) {
        var city = CITIES[i];
        var name = getCityName(city);
        var desc = getCityDesc(city);
        var realCount = (liveCounts && liveCounts[city.id]) ? liveCounts[city.id] : 0;

        if (filter === '' || name.toLowerCase().indexOf(filter.toLowerCase()) !== -1) {
          var card = '<div onclick="openCityBoard(\'' + city.id + '\')" class="bg-white p-2.5 rounded-2xl border border-slate-200 shadow-sm hover:border-indigo-400 cursor-pointer flex flex-col justify-between space-y-1.5 w-full min-w-0">' +

        mapTypeControl: false,
        streetViewControl: false
      };

        var infowindow = new google.maps.InfoWindow({
          content: '<div style="padding:6px; font-size:11px; font-weight:bold; text-align:center;">' +
            cName + '<br><span style="font-size:10px; color:#4f46e5; cursor:pointer;" onclick="openCityBoard(\'' + c.id + '\')">' + t.mapQaLink + '</span>' +
          '</div>'
        });

        (function(m, iw) {
          m.addListener("click", function() {
            iw.open(googleMapInstance, m);
          });
        })(marker, infowindow);

        googleMapMarkers.push(marker);
      }

      moveToMyLocation(false);
    }

    function searchGoogleMapLocation() {
      var query = document.getElementById('mapSearchInput').value.trim();
      if (!query || !googleMapInstance) return;

      for (var i = 0; i < searchMarkers.length; i++) {
        searchMarkers[i].setMap(null);
      }
      searchMarkers = [];

      var targetText = query;
      if (query === "현대") targetText = "더현대 대구";

      var geocoder = new google.maps.Geocoder();
      var geocodeOptions = { address: targetText };
      if (userLatLng) geocodeOptions.location = userLatLng;

      geocoder.geocode(geocodeOptions, function(results, status) {
        if (status === "OK" && results[0]) {
          var loc = results[0].geometry.location;
          var placeName = results[0].formatted_address || targetText;

          googleMapInstance.setCenter(loc);
          googleMapInstance.setZoom(16);

          var sMarker = new google.maps.Marker({
            map: googleMapInstance,
            position: loc,
            title: placeName,
            animation: google.maps.Animation.DROP
          });

          var encodedQuery = encodeURIComponent(targetText);
          var naverMapUrl = "https://m.map.naver.com/search2/search.naver?query=" + encodedQuery;
          var kakaoMapUrl = "https://m.map.kakao.com/actions/searchView?q=" + encodedQuery;

          var windowContent = '<div style="padding:8px; font-size:12px; font-family:sans-serif; max-width:210px;">' +
            '<strong style="color:#1e293b; font-size:13px; display:block; margin-bottom:3px;">📍 ' + targetText + '</strong>' +
            '<span style="color:#64748b; font-size:10px; display:block; margin-bottom:8px; line-height:1.2;">' + placeName + '</span>' +
            '<div style="display:flex; flex-direction:column; gap:5px;">' +
              '<a href="' + naverMapUrl + '" target="_blank" style="text-align:center; background:#03C75A; color:white; text-decoration:none; padding:7px 8px; border-radius:8px; font-size:11px; font-weight:bold; display:block;">' +
                '🧭 네이버 지도로 길찾기' +
              '</a>' +
              '<a href="' + kakaoMapUrl + '" target="_blank" style="text-align:center; background:#FEE500; color:#191919; text-decoration:none; padding:7px 8px; border-radius:8px; font-size:11px; font-weight:bold; display:block;">' +
                '💛 카카오맵으로 길찾기' +
              '</a>' +
            '</div>' +
          '</div>';

          var sInfoWindow = new google.maps.InfoWindow({
            content: windowContent
          });

          sMarker.addListener("click", function() {
            sInfoWindow.open(googleMapInstance, sMarker);
          });

          sInfoWindow.open(googleMapInstance, sMarker);
          searchMarkers.push(sMarker);
        } else {
          alert("장소를 찾을 수 없습니다. (예: 더현대 대구, 반월당역)");
        }
      });
    }

    function moveToMyLocation(shouldPan) {
      var panToUser = (shouldPan !== undefined) ? shouldPan : true;

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          var lat = position.coords.latitude;
          var lng = position.coords.longitude;
          userLatLng = { lat: lat, lng: lng };

          if (myLocationMarker) {
            myLocationMarker.setMap(null);
          }

          if (typeof google !== 'undefined' && google.maps) {
            myLocationMarker = new google.maps.Marker({
              position: userLatLng,
              map: googleMapInstance,
              title: "My Location",
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 9,
                fillColor: "#ef4444",
                fillOpacity: 1,
                strokeColor: "#ffffff",
                strokeWeight: 2
              }
            });

            if (panToUser && googleMapInstance) {
              googleMapInstance.setCenter(userLatLng);
              googleMapInstance.setZoom(14);
            }
          }
        }, function(error) {
          if (panToUser) {
            alert("위치 정보를 가져올 수 없습니다. 브라우저 위치 접근을 허용해 주세요.");
          }
        });
      }
    }

    function goBack() {
      if (currentRoomUsersRef) {
        sendSystemMessage(myName + '님이 퇴장하셨습니다.');
        currentRoomUsersRef.remove();
        currentRoomUsersRef = null;
      }

      if (currentView === 'chat') {
        openChatRoomList();
      } else if (currentView === 'roomList') {
        openCityBoard(currentCity.id);
      } else {
        currentCity = null;
        currentRoom = null;
        currentView = 'home';

        document.getElementById('homeView').classList.remove('hidden');
        document.getElementById('boardView').classList.add('hidden');
        document.getElementById('roomListView').classList.add('hidden');
        document.getElementById('chatView').classList.add('hidden');
        document.getElementById('mapView').classList.add('hidden');
        document.getElementById('chatView').classList.remove('flex');
        
        document.getElementById('backBtn').classList.add('hidden');
        document.getElementById('refreshBtn').classList.add('hidden');

        var t = I18N[currentLang] || I18N['ko'];
        
        document.getElementById('headerTitle').innerHTML = '<svg class="w-4 h-5 fill-indigo-200 shrink-0" viewBox="0 0 100 140"><path d="M40,5 Q55,8 60,18 Q68,28 62,38 Q58,45 68,52 Q78,60 70,72 Q62,82 65,95 Q68,110 52,125 Q42,135 38,128 Q32,118 38,102 Q42,92 35,82 Q28,72 32,58 Q35,48 25,35 Q18,25 28,15 Z"/><circle cx="82" cy="118" r="5"/><circle cx="92" cy="55" r="3"/></svg><span class="truncate">Korea Local Talk</span>';
        document.getElementById('headerSub').innerText = t.appSub;
      }
    }

    function switchTab(tabName) {
      var tHome = document.getElementById('tabHome');
      var tMap = document.getElementById('tabMap');
      var tMy = document.getElementById('tabMy');

      tHome.className = "flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition";
      tMap.className = "flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition";
      tMy.className = "flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition";

      if (tabName === 'home') {
        tHome.className = "flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition";
        goBack();
      } else if (tabName === 'map') {
        tMap.className = "flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition";
        currentView = 'map';

        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('boardView').classList.add('hidden');
        document.getElementById('roomListView').classList.add('hidden');
        document.getElementById('chatView').classList.add('hidden');
        document.getElementById('mapView').classList.remove('hidden');

        document.getElementById('backBtn').classList.remove('hidden');
        document.getElementById('refreshBtn').classList.add('hidden');

        var t = I18N[currentLang] || I18N['ko'];
        document.getElementById('headerTitle').innerText = t.mapTitle;
        document.getElementById('headerSub').innerText = t.mapSub;

        loadGoogleMapsScript(currentLang, renderGoogleMap);
      } else if (tabName === 'my') {
        tMy.className = "flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition";
        alert('👤 [My] 내 프로필 및 작성한 Q&A 내역 기능 준비 중입니다!');
      }
    }

    function renderMessages(msgs) {
      var container = document.getElementById('messageList');
      container.innerHTML = '';
      var t = I18N[currentLang] || I18N['ko'];

      if (!msgs || msgs.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs">' + t.noMsg + '</div>';
        return;
      }

      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];

        // 시스템 알림 메시지 (입퇴장 알림)
        if (m.isSystem) {
          var sysCard = '<div class="flex justify-center my-1 w-full">' +
            '<span class="bg-slate-200/80 text-slate-600 text-[10px] px-3 py-1 rounded-full font-bold shadow-xs">💬 ' + escapeHtml(m.text) + '</span>' +
          '</div>';
          container.innerHTML += sysCard;
          continue;
        }

        var isMyMsg = (m.uid === myUserId);

        var transBtnHtml = '<button onclick="translateMsg(\'' + m.id + '\', \'' + escapeHtml(m.text) + '\')" class="mt-1 text-[10px] text-indigo-600 font-bold hover:underline block">[번역하기]</button>';
        
        var transBoxHtml = '';
        if (m.trans) {
          if (isMyMsg) {
            transBoxHtml = '<div class="mt-1.5 pt-1.5 border-t border-indigo-400/50 text-[11px] text-amber-200 font-medium chat-bubble">' + m.trans + '</div>';
          } else {
            transBoxHtml = '<div class="mt-1.5 pt-1.5 border-t border-slate-200 text-[11px] text-indigo-700 font-medium chat-bubble">' + m.trans + '</div>';
          }
        }

        var msgCard = '<div class="flex flex-col w-full ' + (isMyMsg ? 'items-end' : 'items-start') + '">' +
          '<span class="text-[10px] text-slate-400 px-1 mb-0.5">' + (isMyMsg ? t.mySender : m.sender) + '</span>' +
          '<div class="max-w-[80%] rounded-2xl p-2.5 text-xs leading-relaxed chat-bubble ' + (isMyMsg ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 shadow-sm rounded-tl-none') + '">' +
            escapeHtml(m.text) + transBoxHtml +
          '</div>' +
          transBtnHtml +
          '<span class="text-[9px] text-slate-400 px-1 mt-0.5">' + m.time + '</span>' +
        '</div>';
        container.innerHTML += msgCard;
      }

      var scrollArea = document.getElementById('chatScrollArea');
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function sendSystemMessage(msgText) {
      if (!currentCity || !currentRoom) return;
      var newMsgRef = db.ref('rooms/' + currentCity.id + '/' + currentRoom + '/messages').push();
      newMsgRef.set({
        id: newMsgRef.key,
        isSystem: true,
        text: msgText,
        time: ''
      });
    }

    function translateMsg(msgId, text) {
      var targetLang = currentLang;
      if (currentLang === 'ko') {
        var hasKorean = /[가-힣]/.test(text);
        targetLang = hasKorean ? 'en' : 'ko';
      }

      var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + targetLang + '&dt=t&q=' + encodeURIComponent(text);

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data[0]) {
            var fullTrans = '';
            for (var i = 0; i < data[0].length; i++) {
              if (data[0][i][0]) fullTrans += data[0][i][0];
            }
            db.ref('rooms/' + currentCity.id + '/' + currentRoom + '/messages/' + msgId + '/trans').set('[번역] ' + fullTrans);
          }
        })
        .catch(function(err) {
          alert('번역 실패: 인터넷 연결을 확인해 주세요.');
        });
    }

    function sendMessage() {
      var input = document.getElementById('msgInput');
      var text = input.value.trim();
      if (!text || !currentCity || !currentRoom) return;

      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      var timeStr = (hours >= 12 ? 'PM' : 'AM') + ' ' + (hours % 12 || 12) + ':' + (minutes < 10 ? '0' : '') + minutes;

      var newMsgRef = db.ref('rooms/' + currentCity.id + '/' + currentRoom + '/messages').push();
      newMsgRef.set({
        id: newMsgRef.key,
        uid: myUserId,
        sender: myName,
        text: text,
        time: timeStr
      });

      input.value = '';
      input.focus();
    }

    function loadMessages() {
      var icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('fa-spin');
      setTimeout(function() {
        if (icon) icon.classList.remove('fa-spin');
      }, 500);
    }

    function changeLanguage(lang) {
      currentLang = lang;
      var t = I18N[currentLang] || I18N['ko'];

      document.getElementById('headerSub').innerText = t.appSub;
      document.getElementById('citySearch').placeholder = t.searchPlaceholder;
      document.getElementById('popularTitle').innerText = t.popularTitle;
      document.getElementById('msgInput').placeholder = t.inputPlaceholder;
      document.getElementById('sendBtn').innerText = t.send;

      if (currentCity) {
        var cityName = getCityName(currentCity);
        if (currentView === 'board') {
          document.getElementById('headerTitle').innerText = cityName + t.boardTitleSuffix;
          document.getElementById('headerSub').innerText = t.boardSub;
          document.getElementById('boardBannerTitle').innerText = cityName + t.boardBannerSuffix;
          document.getElementById('boardBannerSub').innerText = t.boardBannerSub;
          document.getElementById('boardPostsTitle').innerHTML = t.boardPostsTitle;
          renderBoardPosts();
        } else if (currentView === 'roomList') {
          document.getElementById('headerTitle').innerText = cityName + t.roomListTitle;
          renderChatRooms();
        } else if (currentView === 'chat') {
          document.getElementById('headerTitle').innerText = cityName + ' Room #' + currentRoom;
          document.getElementById('chatNoticeTitle').innerText = cityName + ' Room #' + currentRoom + ' Q&A';
          document.getElementById('chatNoticeSub').innerText = t.noticeSub;
        }
      }

      if (currentView === 'map') {
        document.getElementById('headerTitle').innerText = t.mapTitle;
        document.getElementById('headerSub').innerText = t.mapSub;
        loadGoogleMapsScript(currentLang, renderGoogleMap);
      }

      renderCityList(document.getElementById('citySearch').value);
    }

    function filterCities() {
      var query = document.getElementById('citySearch').value;
      renderCityList(query);
    }

    listenCityUsers();
  </script>
</body>
