<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LocalTalk - 글로벌 도시 현지인 Q&A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* PC 환경 배경화면 및 모바일 프레임 중앙 정렬 */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: #0f172a; /* PC 브라우저 배경: 어두운 슬레이트 톤 */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 앱 메인 프레임 (PC에서는 모바일 폰 모양, 모바일 기기에서는 100% 가득 참) */
    .app-container {
      width: 100%;
      max-width: 430px; /* 스마트폰 폭 고정 */
      height: 100%;
      max-height: 900px; /* PC에서 모바일 높이 감싸기 */
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* 모바일 기기 접속 시 풀스크린 처리 */
    @media (max-width: 640px) {
      .app-container {
        max-width: 100% !important;
        max-height: 100% !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
    }

    .scroll-area {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    .chat-bubble { 
      word-break: break-all !important; 
      overflow-wrap: anywhere !important; 
    }
  </style>
</head>
<body>

  <!-- 앱 전체를 감싸는 모바일 규격 컨테이너 -->
  <div class="app-container sm:rounded-[36px] border-slate-700 sm:border-[8px]">

    <!-- 1. 상단 헤더 -->
    <header class="bg-indigo-600 text-white px-4 py-3 shrink-0 flex justify-between items-center shadow-md w-full z-50">
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <button id="backBtn" onclick="goHome()" class="hidden text-white hover:text-indigo-200 text-lg pr-1 shrink-0">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="min-w-0 flex-1">
          <h1 id="headerTitle" class="text-sm sm:text-base font-bold flex items-center gap-1.5 truncate">
            <i class="fas fa-globe-asia text-indigo-200 shrink-0"></i> <span class="truncate">LocalTalk</span>
          </h1>
          <p id="headerSub" class="text-[10px] text-indigo-100 truncate">전 세계 도시 실시간 현지인 Q&A</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1.5 shrink-0 ml-1">
        <button id="refreshBtn" onclick="loadMessages()" class="hidden bg-indigo-700 hover:bg-indigo-800 text-white p-1.5 rounded-full text-xs font-bold items-center justify-center">
          <i class="fas fa-sync-alt text-[10px]" id="refreshIcon"></i>
        </button>
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-indigo-700 text-white text-[11px] font-bold py-1 px-2 rounded-full border border-indigo-500 focus:outline-none cursor-pointer">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <!-- 2. 도시 선택 메인 화면 -->
    <main id="homeView" class="p-4 space-y-3.5 flex-1 scroll-area w-full pb-8">
      <div class="relative w-full">
        <i class="fas fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="citySearch" onkeyup="filterCities()" placeholder="궁금한 도시를 검색하세요 (예: 대구, 서울)" class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
      </div>

      <div class="w-full">
        <h2 id="popularTitle" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">인기 도시 채팅방</h2>
        <div id="cityList" class="grid grid-cols-2 gap-2.5 w-full"></div>
      </div>
    </main>

    <!-- 3. 도시별 채팅 화면 영역 -->
    <div id="chatView" class="hidden flex-1 flex-col overflow-hidden w-full relative bg-slate-50">
      <!-- 메시지 목록 영역 -->
      <main class="flex-1 p-3.5 space-y-3 scroll-area w-full pb-4" id="chatScrollArea">
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 text-xs text-indigo-800 flex items-start gap-2 w-full">
          <i class="fas fa-info-circle text-indigo-500 mt-0.5 shrink-0 text-xs"></i>
          <div class="min-w-0 flex-1">
            <strong id="chatNoticeTitle" class="text-xs">대구 현지인 Q&A 방</strong><br>
            <span id="chatNoticeSub" class="text-[11px]">여행 중 궁금한 점을 물어보세요! 현지 주민들이 답해드립니다.</span>
          </div>
        </div>

        <div id="messageList" class="space-y-3 w-full"></div>
      </main>

      <!-- 하단 메시지 입력창 -->
      <footer id="chatInputBar" class="bg-white border-t border-slate-200 px-3 py-2.5 flex gap-2 items-center shrink-0 z-40 w-full">
        <input type="text" id="msgInput" onkeypress="if(event.key==='Enter') sendMessage()" placeholder="질문이나 답변을 입력하세요..." class="flex-1 min-w-0 bg-slate-100 border-none rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button id="sendBtn" onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl font-bold text-xs flex items-center justify-center transition shadow-sm whitespace-nowrap shrink-0">
          전송
        </button>
      </footer>
    </div>

  </div>

  <script>
    var currentLang = 'ko';
    var currentCity = null;

    var localStore = {};

    var I18N = {
      ko: {
        appSub: '전 세계 도시 실시간 현지인 Q&A',
        searchPlaceholder: '궁금한 도시를 검색하세요 (예: 대구, 서울)',
        popularTitle: '인기 도시 채팅방',
        online: '명 접속 중',
        enter: '입장하기',
        noticeSub: '여행 중 궁금한 점을 물어보세요! 현지 주민들이 답해드립니다.',
        inputPlaceholder: '질문이나 답변을 입력하세요...',
        noMsg: '아직 등록된 메시지가 없습니다. 첫 질문을 남겨보세요!',
        mySender: '나 (User)'
      },
      en: {
        appSub: 'Real-time Local Q&A for Cities Worldwide',
        searchPlaceholder: 'Search city (e.g. Daegu, Seoul)',
        popularTitle: 'Popular City Chats',
        online: 'online',
        enter: 'Join Chat',
        noticeSub: 'Ask local residents anything about your trip!',
        inputPlaceholder: 'Ask a question or share local tips...',
        noMsg: 'No messages yet. Be the first to ask!',
        mySender: 'Me (User)'
      }
    };

    var CITIES = [
      { id: 'daegu', name_ko: '대한민국 대구', name_en: 'Daegu, Korea', iconTag: '<i class="fas fa-building text-indigo-500 text-sm"></i>', desc_ko: '동성로, 서문시장, 현지 맛집 질문', desc_en: 'Dongseong-ro, Seomun Market & Local Eats', users: 128 },
      { id: 'seoul', name_ko: '대한민국 서울', name_en: 'Seoul, Korea', iconTag: '<i class="fas fa-tower-broadcast text-blue-500 text-sm"></i>', desc_ko: '명동, 홍대, 핫플레이스 실시간 정보', desc_en: 'Myeongdong, Hongdae & Hotspots', users: 340 },
      { id: 'busan', name_ko: '대한민국 부산', name_en: 'Busan, Korea', iconTag: '<i class="fas fa-water text-cyan-500 text-sm"></i>', desc_ko: '해운대, 광안리, 국밥/해산물 추천', desc_en: 'Haeundae, Gwangalli & Seafood Spots', users: 215 },
      { id: 'jeju', name_ko: '대한민국 제주', name_en: 'Jeju Island', iconTag: '<i class="fas fa-mountain text-emerald-500 text-sm"></i>', desc_ko: '렌터카, 날씨, 흑돼지/카페 질문', desc_en: 'Rental Cars, Weather & Black Pork', users: 189 },
      { id: 'tokyo', name_ko: '일본 도쿄', name_en: 'Tokyo, Japan', iconTag: '<i class="fas fa-torii-gate text-red-500 text-sm"></i>', desc_ko: '신주쿠, 시부야, 맛집 및 라멘 추천', desc_en: 'Shinjuku, Shibuya & Ramen Guides', users: 412 },
      { id: 'danang', name_ko: '베트남 다낭', name_en: 'Da Nang, Vietnam', iconTag: '<i class="fas fa-umbrella-beach text-amber-500 text-sm"></i>', desc_ko: '바나힐, 미케비치, 환전 및 마사지', desc_en: 'Bana Hills, My Khe Beach & Currency', users: 156 }
    ];

    function renderCityList(filterKeyword) {
      var filter = filterKeyword || '';
      var listContainer = document.getElementById('cityList');
      if (!listContainer) return;

      listContainer.innerHTML = '';
      var t = I18N[currentLang];

      for (var i = 0; i < CITIES.length; i++) {
        var city = CITIES[i];
        var name = (currentLang === 'en') ? city.name_en : city.name_ko;
        var desc = (currentLang === 'en') ? city.desc_en : city.desc_ko;

        if (filter === '' || name.toLowerCase().indexOf(filter.toLowerCase()) !== -1) {
          var card = '<div onclick="openCityChat(\'' + city.id + '\')" class="bg-white p-2.5 rounded-2xl border border-slate-200 shadow-sm hover:border-indigo-400 cursor-pointer flex flex-col justify-between space-y-1.5 w-full min-w-0">' +
            '<div>' +
              '<div class="flex justify-between items-center">' +
                '<span>' + city.iconTag + '</span>' +
                '<span class="text-[9px] bg-emerald-50 text-emerald-600 font-bold px-1.5 py-0.5 rounded-full border border-emerald-100">' + city.users + ' ' + t.online + '</span>' +
              '</div>' +
              '<h3 class="font-bold text-slate-800 text-xs mt-1 truncate">' + name + '</h3>' +
              '<p class="text-[10px] text-slate-500 line-clamp-2 mt-0.5 leading-tight">' + desc + '</p>' +
            '</div>' +
            '<div class="text-[10px] font-bold text-indigo-600 text-right mt-0.5">' + t.enter + ' &gt;</div>' +
          '</div>';
          listContainer.innerHTML += card;
        }
      }
    }

    function openCityChat(cityId) {
      for (var i = 0; i < CITIES.length; i++) {
        if (CITIES[i].id === cityId) {
          currentCity = CITIES[i];
          break;
        }
      }
      if (!currentCity) return;

      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('chatView').classList.remove('hidden');
      document.getElementById('chatView').classList.add('flex');
      
      document.getElementById('backBtn').classList.remove('hidden');
      document.getElementById('refreshBtn').classList.remove('hidden');
      document.getElementById('refreshBtn').classList.add('flex');

      var cityName = (currentLang === 'en') ? currentCity.name_en : currentCity.name_ko;
      var t = I18N[currentLang];

      document.getElementById('headerTitle').innerText = cityName;
      document.getElementById('headerSub').innerText = cityName + ' (' + currentCity.users + ' ' + t.online + ')';
      document.getElementById('chatNoticeTitle').innerText = (currentLang === 'en') ? (cityName + ' Local Q&A') : (cityName + ' 현지인 Q&A 방');

      if (!localStore[currentCity.id]) {
        localStore[currentCity.id] = [
          { id: 1, sender: 'Alex (Tourist)', text: 'Is Seomun Market open tonight? What food should I try?', time: '8:12 PM', isMe: false },
          { id: 2, sender: '대구 현지인', text: '네! 서문시장 야시장 밤 10시까지 합니다. 납작만두 추천해요!', time: '8:15 PM', isMe: false }
        ];
      }

      renderMessages();
    }

    function goHome() {
      currentCity = null;
      document.getElementById('homeView').classList.remove('hidden');
      document.getElementById('chatView').classList.add('hidden');
      document.getElementById('chatView').classList.remove('flex');
      
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('refreshBtn').classList.add('hidden');
      document.getElementById('refreshBtn').classList.remove('flex');

      var t = I18N[currentLang];
      document.getElementById('headerTitle').innerText = 'LocalTalk';
      document.getElementById('headerSub').innerText = t.appSub;
    }

    function renderMessages() {
      var container = document.getElementById('messageList');
      container.innerHTML = '';
      var t = I18N[currentLang];

      var msgs = localStore[currentCity.id] || [];

      if (msgs.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs">' + t.noMsg + '</div>';
        return;
      }

      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        var isMyMsg = m.isMe;

        var transBtnHtml = '<button onclick="translateMsg(' + i + ')" class="mt-1 text-[10px] text-indigo-600 font-bold hover:underline block">[번역하기]</button>';
        
        var transBoxHtml = '';
        if (m.trans) {
          if (isMyMsg) {
            transBoxHtml = '<div class="mt-1.5 pt-1.5 border-t border-indigo-400/50 text-[11px] text-amber-200 font-medium chat-bubble">' + m.trans + '</div>';
          } else {
            transBoxHtml = '<div class="mt-1.5 pt-1.5 border-t border-slate-200 text-[11px] text-indigo-700 font-medium chat-bubble">' + m.trans + '</div>';
          }
        }

        var msgCard = '<div class="flex flex-col w-full ' + (isMyMsg ? 'items-end' : 'items-start') + '">' +
          '<span class="text-[10px] text-slate-400 px-1 mb-0.5">' + m.sender + '</span>' +
          '<div class="max-w-[80%] rounded-2xl p-2.5 text-xs leading-relaxed chat-bubble ' + (isMyMsg ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 shadow-sm rounded-tl-none') + '">' +
            m.text + transBoxHtml +
          '</div>' +
          transBtnHtml +
          '<span class="text-[9px] text-slate-400 px-1 mt-0.5">' + m.time + '</span>' +
        '</div>';
        container.innerHTML += msgCard;
      }

      var scrollArea = document.getElementById('chatScrollArea');
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    function translateMsg(idx) {
      var msgObj = localStore[currentCity.id][idx];
      if (!msgObj) return;

      var text = msgObj.text;
      
      var hasKorean = /[가-힣]/.test(text);
      var targetLang = hasKorean ? 'en' : 'ko';

      var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + targetLang + '&dt=t&q=' + encodeURIComponent(text);

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data[0]) {
            var fullTrans = '';
            for (var i = 0; i < data[0].length; i++) {
              if (data[0][i][0]) fullTrans += data[0][i][0];
            }
            msgObj.trans = '[번역] ' + fullTrans;
            renderMessages();
          }
        })
        .catch(function(err) {
          alert('번역 실패: 인터넷 연결을 확인해 주세요.');
        });
    }

    function sendMessage() {
      var input = document.getElementById('msgInput');
      var sendBtn = document.getElementById('sendBtn');
      var text = input.value.trim();
      if (!text || !currentCity) return;

      var t = I18N[currentLang];
      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      var timeStr = (hours >= 12 ? 'PM' : 'AM') + ' ' + (hours % 12 || 12) + ':' + (minutes < 10 ? '0' : '') + minutes;

      localStore[currentCity.id].push({
        id: Date.now(),
        sender: t.mySender,
        text: text,
        time: timeStr,
        isMe: true
      });

      input.value = '';
      input.disabled = false;
      if (sendBtn) sendBtn.disabled = false;

      renderMessages();
      input.focus();
    }

    function loadMessages() {
      var icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('fa-spin');
      
      setTimeout(function() {
        if (icon) icon.classList.remove('fa-spin');
        renderMessages();
      }, 500);
    }

    function changeLanguage(lang) {
      currentLang = lang;
      var t = I18N[currentLang];

      document.getElementById('headerSub').innerText = t.appSub;
      document.getElementById('citySearch').placeholder = t.searchPlaceholder;
      document.getElementById('popularTitle').innerText = t.popularTitle;
      document.getElementById('chatNoticeSub').innerText = t.noticeSub;
      document.getElementById('msgInput').placeholder = t.inputPlaceholder;

      if (currentCity) {
        var cityName = (currentLang === 'en') ? currentCity.name_en : currentCity.name_ko;
        document.getElementById('headerTitle').innerText = cityName;
        document.getElementById('chatNoticeTitle').innerText = (currentLang === 'en') ? (cityName + ' Local Q&A') : (cityName + ' 현지인 Q&A 방');
      }

      renderCityList(document.getElementById('citySearch').value);
      if (currentCity) renderMessages();
    }

    function filterCities() {
      var query = document.getElementById('citySearch').value;
      renderCityList(query);
    }

    renderCityList('');
  </script>
</body>
</html>
