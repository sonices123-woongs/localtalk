<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LocalTalk - 대한민국 실시간 현지인 Q&A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 900px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 640px) {
      .app-container {
        max-width: 100% !important;
        max-height: 100% !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
    }

    .scroll-area {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    .chat-bubble { 
      word-break: break-all !important; 
      overflow-wrap: anywhere !important; 
    }
  </style>
</head>
<body>

  <div class="app-container sm:rounded-[36px] border-slate-700 sm:border-[8px]">

    <!-- 1. 상단 헤더 -->
    <header class="bg-indigo-600 text-white px-3.5 py-3 shrink-0 flex justify-between items-center shadow-md w-full z-50">
      <div class="flex items-center gap-1.5 min-w-0 flex-1">
        <button id="backBtn" onclick="goBack()" class="hidden text-white hover:text-indigo-200 text-lg pr-1 shrink-0">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="min-w-0 flex-1">
          <h1 id="headerTitle" class="text-sm sm:text-base font-bold flex items-center gap-1.5 truncate">
            <i class="fas fa-globe-asia text-indigo-200 shrink-0"></i> <span class="truncate">LocalTalk</span>
          </h1>
          <p id="headerSub" class="text-[10px] text-indigo-100 truncate">대한민국 실시간 현지인 Q&A</p>
        </div>
      </div>
      
      <!-- Language 라벨 고정 및 4개국어 지원 -->
      <div class="flex items-center gap-1 shrink-0 ml-1">
        <button id="refreshBtn" onclick="loadMessages()" class="hidden bg-indigo-700 hover:bg-indigo-800 text-white p-1.5 rounded-full text-xs font-bold items-center justify-center mr-0.5">
          <i class="fas fa-sync-alt text-[10px]" id="refreshIcon"></i>
        </button>
        <span class="text-[10px] text-indigo-200 font-bold">Language:</span>
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-indigo-700 text-white text-[10px] font-bold py-1 px-1.5 rounded-full border border-indigo-500 focus:outline-none cursor-pointer">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh-CN">中文</option>
        </select>
      </div>
    </header>

    <!-- [화면 1] 도시 선택 메인 화면 -->
    <main id="homeView" class="p-4 space-y-3.5 flex-1 scroll-area w-full pb-8">
      <div class="relative w-full">
        <i class="fas fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="citySearch" onkeyup="filterCities()" placeholder="궁금한 도시를 검색하세요 (예: 서울, 제주, 부산)" class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
      </div>

      <div class="w-full">
        <h2 id="popularTitle" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">대한민국 주요 도시 목록</h2>
        <div id="cityList" class="grid grid-cols-2 gap-2.5 w-full"></div>
      </div>
    </main>

    <!-- [화면 2] 지역 게시판 메인 화면 -->
    <main id="boardView" class="hidden p-4 space-y-3.5 flex-1 scroll-area w-full pb-8">
      <div onclick="openCityChatDirect()" class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-3.5 rounded-2xl shadow-md cursor-pointer flex justify-between items-center hover:opacity-95 transition">
        <div>
          <span class="bg-white/20 text-[10px] px-2 py-0.5 rounded-full font-bold">LIVE Q&A</span>
          <h3 id="boardBannerTitle" class="font-bold text-sm mt-1">서울 실시간 대화방 입장하기</h3>
          <p id="boardBannerSub" class="text-[11px] text-indigo-100 mt-0.5">현지 주민들과 실시간 질문/답변 나누기</p>
        </div>
        <div class="bg-white text-indigo-600 w-9 h-9 rounded-full flex items-center justify-center text-sm shadow shrink-0">
          <i class="fas fa-comments"></i>
        </div>
      </div>

      <div>
        <h3 id="boardPostsTitle" class="text-xs font-bold text-slate-600 mb-2 flex items-center gap-1">
          <i class="fas fa-bullhorn text-amber-500"></i> 필독 정보 & 지역 꿀팁
        </h3>
        <div id="boardPosts" class="space-y-2"></div>
      </div>
    </main>

    <!-- [화면 3] 도시별 실시간 대화방 화면 -->
    <div id="chatView" class="hidden flex-1 flex-col overflow-hidden w-full relative bg-slate-50">
      <main class="flex-1 p-3.5 space-y-3 scroll-area w-full pb-4" id="chatScrollArea">
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 text-xs text-indigo-800 flex items-start gap-2 w-full">
          <i class="fas fa-info-circle text-indigo-500 mt-0.5 shrink-0 text-xs"></i>
          <div class="min-w-0 flex-1">
            <strong id="chatNoticeTitle" class="text-xs">서울 현지인 Q&A 방</strong><br>
            <span id="chatNoticeSub" class="text-[11px]">여행 중 궁금한 점을 물어보세요! 현지 주민들이 답해드립니다.</span>
          </div>
        </div>

        <div id="messageList" class="space-y-3 w-full"></div>
      </main>

      <footer id="chatInputBar" class="bg-white border-t border-slate-200 px-3 py-2.5 flex gap-2 items-center shrink-0 z-40 w-full">
        <input type="text" id="msgInput" onkeypress="if(event.key==='Enter') sendMessage()" placeholder="질문이나 답변을 입력하세요..." class="flex-1 min-w-0 bg-slate-100 border-none rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button id="sendBtn" onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl font-bold text-xs flex items-center justify-center transition shadow-sm whitespace-nowrap shrink-0">
          전송
        </button>
      </footer>
    </div>

  </div>

        iconTag: '<div class="w-9 h-9 rounded-xl bg-teal-50 border border-teal-100 flex items-center justify-center p-1 shadow-sm"><svg viewBox="0 0 100 80" class="w-full h-full"><circle cx="25" cy="22" r="12" fill="#f59e0b"/><path d="M30,40 Q60,20 90,40 L60,75 Z" fill="#0d9488"/><line x1="60" y1="40" x2="60" y2="75" stroke="#ffffff" stroke-width="2"/></svg></div>', 
        desc: { ko: '안목해변 커피거리, 경포대, 짬뽕순두부', en: 'Anmok Coffee Street & Beach Views', ja: '安木海岸コーヒー街、鏡浦台', 'zh-CN': '安木海滩咖啡街、镜浦台' }, 
        users: 178 
      }
    ];

    var BOARD_DATA = {
      seoul: [
        { title: '[공지] 성수동/홍대 최신 팝업스토어 스케줄', author: '서울나들이', date: '오늘', views: 890, tag: '공지' },
        { title: '명동 실시간 환전율 가장 높은 곳 추천', author: '명동지킴이', date: '어제', views: 650, tag: '팁' }
      ],
      jeju: [
        { title: '[팁] 제주 렌터카 환불 및 사고 처리 가이드', author: '제주돌이', date: '오늘', views: 540, tag: '팁' },
        { title: '애월읍 일몰 보기 가장 예쁜 감성 카페 TOP 3', author: '제주해녀', date: '어제', views: 420, tag: '추천' }
      ],
      busan: [
        { title: '[추천] 광안리 드론쇼 명당 및 주차 꿀팁', author: '부산갈매기', date: '오늘', views: 780, tag: '추천' },
        { title: '해운대 국밥거리 진짜 현지인 맛집 비교', author: '부산사나이', date: '어제', views: 610, tag: '맛집' }
      ],
      daegu: [
        { title: '[공지] 서문시장 야시장 운영시간 및 주차 안내', author: '대구시 가이드', date: '오늘', views: 420, tag: '공지' },
        { title: '동성로 현지인만 아는 납작만두 맛집 TOP 3', author: '동성로주민', date: '어제', views: 312, tag: '맛집' }
      ],
      incheon: [
        { title: '[팁] 인천공항 심야버스 타는 위치 및 시간표', author: '공항러', date: '오늘', views: 320, tag: '팁' }
      ],
      gyeongju: [
        { title: '[추천] 동궁과 월지 야경 인생샷 찍는 동선', author: '경주여행가', date: '오늘', views: 510, tag: '추천' }
      ],
      jeonju: [
        { title: '[팁] 전주 한옥마을 한복 대여 시 할인받는 법', author: '한옥마을돌이', date: '오늘', views: 290, tag: '팁' }
      ],
      gangneung: [
        { title: '[추천] 안목해변 커피거리 오션뷰 카페 BEST 4', author: '강릉바다', date: '오늘', views: 620, tag: '추천' }
      ]
    };

    function getCityName(city) {
      if (!city) return '';
      return city.name[currentLang] || city.name['ko'];
    }

    function getCityDesc(city) {
      if (!city) return '';
      return city.desc[currentLang] || city.desc['ko'];
    }

    function renderCityList(filterKeyword) {
      var filter = filterKeyword || '';
      var listContainer = document.getElementById('cityList');
      if (!listContainer) return;

      listContainer.innerHTML = '';
      var t = I18N[currentLang] || I18N['ko'];

      for (var i = 0; i < CITIES.length; i++) {
        var city = CITIES[i];
        var name = getCityName(city);
        var desc = getCityDesc(city);

        if (filter === '' || name.toLowerCase().indexOf(filter.toLowerCase()) !== -1) {
          var card = '<div onclick="openCityBoard(\'' + city.id + '\')" class="bg-white p-2.5 rounded-2xl border border-slate-200 shadow-sm hover:border-indigo-400 cursor-pointer flex flex-col justify-between space-y-1.5 w-full min-w-0">' +
            '<div>' +
              '<div class="flex justify-between items-center">' +
                '<span>' + city.iconTag + '</span>' +
                '<span class="text-[9px] bg-emerald-50 text-emerald-600 font-bold px-1.5 py-0.5 rounded-full border border-emerald-100">' + city.users + ' ' + t.online + '</span>' +
              '</div>' +
              '<h3 class="font-bold text-slate-800 text-xs mt-1 truncate">' + name + '</h3>' +
              '<p class="text-[10px] text-slate-500 line-clamp-2 mt-0.5 leading-tight">' + desc + '</p>' +
            '</div>' +
            '<div class="text-[10px] font-bold text-indigo-600 text-right mt-0.5">' + t.enterBoard + ' &gt;</div>' +
          '</div>';
          listContainer.innerHTML += card;
        }
      }
    }

    function openCityBoard(cityId) {
      for (var i = 0; i < CITIES.length; i++) {
        if (CITIES[i].id === cityId) {
          currentCity = CITIES[i];
          break;
        }
      }
      if (!currentCity) return;

      currentView = 'board';

      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('chatView').classList.add('hidden');
      document.getElementById('boardView').classList.remove('hidden');
      
      document.getElementById('backBtn').classList.remove('hidden');
      document.getElementById('refreshBtn').classList.add('hidden');

      var cityName = getCityName(currentCity);
      var t = I18N[currentLang] || I18N['ko'];

      document.getElementById('headerTitle').innerText = cityName + t.boardTitleSuffix;
      document.getElementById('headerSub').innerText = t.boardSub;
      document.getElementById('boardBannerTitle').innerText = cityName + t.boardBannerSuffix;
      document.getElementById('boardBannerSub').innerText = t.boardBannerSub;
      document.getElementById('boardPostsTitle').innerHTML = t.boardPostsTitle;

      renderBoardPosts();
    }

    function renderBoardPosts() {
      var container = document.getElementById('boardPosts');
      container.innerHTML = '';
      
      var posts = BOARD_DATA[currentCity.id] || [
        { title: '추천 여행 코스 공유합니다.', author: '현지인', date: '오늘', views: 50, tag: '추천' },
        { title: '대중교통 이용 안내', author: '운영자', date: '어제', views: 82, tag: '공지' }
      ];

      for (var i = 0; i < posts.length; i++) {
        var p = posts[i];
        var item = '<div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col space-y-1 hover:border-indigo-300 cursor-pointer">' +
          '<div class="flex items-center gap-1.5">' +
            '<span class="text-[9px] bg-indigo-50 text-indigo-600 font-bold px-1.5 py-0.5 rounded">' + p.tag + '</span>' +
            '<h4 class="text-xs font-bold text-slate-800 truncate flex-1">' + p.title + '</h4>' +
          '</div>' +
          '<div class="flex justify-between items-center text-[10px] text-slate-400 mt-1">' +
            '<span>' + p.author + ' · ' + p.date + '</span>' +
            '<span>조회 ' + p.views + '</span>' +
          '</div>' +
        '</div>';
        container.innerHTML += item;
      }
    }

    function openCityChatDirect() {
      if (!currentCity) return;
      currentView = 'chat';

      document.getElementById('boardView').classList.add('hidden');
      document.getElementById('chatView').classList.remove('hidden');
      document.getElementById('chatView').classList.add('flex');
      
      document.getElementById('refreshBtn').classList.remove('hidden');
      document.getElementById('refreshBtn').classList.add('flex');

      var cityName = getCityName(currentCity);
      var t = I18N[currentLang] || I18N['ko'];

      document.getElementById('headerTitle').innerText = cityName + t.chatSuffix;
      document.getElementById('headerSub').innerText = cityName + ' (' + currentCity.users + ' ' + t.online + ')';
      document.getElementById('chatNoticeTitle').innerText = cityName + ' Local Q&A';
      document.getElementById('chatNoticeSub').innerText = t.noticeSub;

      if (!localStore[currentCity.id]) {
        localStore[currentCity.id] = [
          { id: 1, sender: 'Alex (Tourist)', text: 'Hello! I need some local recommendations for ' + cityName + '.', time: '8:12 PM', isMe: false },
          { id: 2, sender: '현지 가이드', text: '안녕하세요! ' + cityName + ' 여행 중 궁금하신 점을 언제든 물어보세요.', time: '8:15 PM', isMe: false }
        ];
      }

      renderMessages();
    }

    function goBack() {
      if (currentView === 'chat') {
        openCityBoard(currentCity.id);
      } else {
        currentCity = null;
        currentView = 'home';

        document.getElementById('homeView').classList.remove('hidden');
        document.getElementById('boardView').classList.add('hidden');
        document.getElementById('chatView').classList.add('hidden');
        document.getElementById('chatView').classList.remove('flex');
        
        document.getElementById('backBtn').classList.add('hidden');
        document.getElementById('refreshBtn').classList.add('hidden');

        var t = I18N[currentLang] || I18N['ko'];
        document.getElementById('headerTitle').innerText = 'LocalTalk';
        document.getElementById('headerSub').innerText = t.appSub;
      }
    }

    function renderMessages() {
      var container = document.getElementById('messageList');
      container.innerHTML = '';
      var t = I18N[currentLang] || I18N['ko'];

      var msgs = localStore[currentCity.id] || [];

      if (msgs.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs">' + t.noMsg + '</div>';
        return;
      }

      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        var isMyMsg = m.isMe;

        var transBtnHtml = '<button onclick="translateMsg(' + i + ')" class="mt-1 text-[10px] text-indigo-600 font-bold hover:underline block">[번역하기]</button>';
        
        var transBoxHtml = '';
        if (m.trans) {
          if (isMyMsg) {
            transBoxHtml = '<div class="mt-1.5 pt-1.5 border-t border-indigo-400/50 text-[11px] text-amber-200 font-medium chat-bubble">' + m.trans + '</div>';
          } else {
            transBoxHtml = '<div class="mt-1.5 pt-1.5 border-t border-slate-200 text-[11px] text-indigo-700 font-medium chat-bubble">' + m.trans + '</div>';
          }
        }

        var msgCard = '<div class="flex flex-col w-full ' + (isMyMsg ? 'items-end' : 'items-start') + '">' +
          '<span class="text-[10px] text-slate-400 px-1 mb-0.5">' + m.sender + '</span>' +
          '<div class="max-w-[80%] rounded-2xl p-2.5 text-xs leading-relaxed chat-bubble ' + (isMyMsg ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 shadow-sm rounded-tl-none') + '">' +
            m.text + transBoxHtml +
          '</div>' +
          transBtnHtml +
          '<span class="text-[9px] text-slate-400 px-1 mt-0.5">' + m.time + '</span>' +
        '</div>';
        container.innerHTML += msgCard;
      }

      var scrollArea = document.getElementById('chatScrollArea');
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    function translateMsg(idx) {
      var msgObj = localStore[currentCity.id][idx];
      if (!msgObj) return;

      var text = msgObj.text;
      var targetLang = currentLang;
      if (currentLang === 'ko') {
        var hasKorean = /[가-힣]/.test(text);
        targetLang = hasKorean ? 'en' : 'ko';
      }

      var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + targetLang + '&dt=t&q=' + encodeURIComponent(text);

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data[0]) {
            var fullTrans = '';
            for (var i = 0; i < data[0].length; i++) {
              if (data[0][i][0]) fullTrans += data[0][i][0];
            }
            msgObj.trans = '[번역] ' + fullTrans;
            renderMessages();
          }
        })
        .catch(function(err) {
          alert('번역 실패: 인터넷 연결을 확인해 주세요.');
        });
    }

    function sendMessage() {
      var input = document.getElementById('msgInput');
      var sendBtn = document.getElementById('sendBtn');
      var text = input.value.trim();
      if (!text || !currentCity) return;

      var t = I18N[currentLang] || I18N['ko'];
      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      var timeStr = (hours >= 12 ? 'PM' : 'AM') + ' ' + (hours % 12 || 12) + ':' + (minutes < 10 ? '0' : '') + minutes;

      localStore[currentCity.id].push({
        id: Date.now(),
        sender: t.mySender,
        text: text,
        time: timeStr,
        isMe: true
      });

      input.value = '';
      input.disabled = false;
      if (sendBtn) sendBtn.disabled = false;

      renderMessages();
      input.focus();
    }

    function loadMessages() {
      var icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('fa-spin');
      
      setTimeout(function() {
        if (icon) icon.classList.remove('fa-spin');
        renderMessages();
      }, 500);
    }

    function changeLanguage(lang) {
      currentLang = lang;
      var t = I18N[currentLang] || I18N['ko'];

      document.getElementById('headerSub').innerText = t.appSub;
      document.getElementById('citySearch').placeholder = t.searchPlaceholder;
      document.getElementById('popularTitle').innerText = t.popularTitle;
      document.getElementById('msgInput').placeholder = t.inputPlaceholder;
      document.getElementById('sendBtn').innerText = t.send;

      if (currentCity) {
        var cityName = getCityName(currentCity);
        if (currentView === 'board') {
          document.getElementById('headerTitle').innerText = cityName + t.boardTitleSuffix;
          document.getElementById('headerSub').innerText = t.boardSub;
          document.getElementById('boardBannerTitle').innerText = cityName + t.boardBannerSuffix;
          document.getElementById('boardBannerSub').innerText = t.boardBannerSub;
          document.getElementById('boardPostsTitle').innerHTML = t.boardPostsTitle;
        } else if (currentView === 'chat') {
          document.getElementById('headerTitle').innerText = cityName + t.chatSuffix;
          document.getElementById('headerSub').innerText = cityName + ' (' + currentCity.users + ' ' + t.online + ')';
          document.getElementById('chatNoticeTitle').innerText = cityName + ' Local Q&A';
          document.getElementById('chatNoticeSub').innerText = t.noticeSub;
        }
      }

      renderCityList(document.getElementById('citySearch').value);
      if (currentCity && currentView === 'chat') renderMessages();
    }

    function filterCities() {
      var query = document.getElementById('citySearch').value;
      renderCityList(query);
    }

    renderCityList('');
  </script>
</body>
