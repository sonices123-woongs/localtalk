  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 900px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 640px) {
      .app-container {
        max-width: 100% !important;
        max-height: 100% !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
    }

    .scroll-area {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    .chat-bubble { 
      word-break: break-all !important; 
      overflow-wrap: anywhere !important; 
    }
  </style>

<body>

  <div class="app-container sm:rounded-[36px] border-slate-700 sm:border-[8px]">

    <!-- 0. 최초 프로필 설정 모달 -->
    <div id="profileModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl space-y-4 border border-slate-100">
        <div class="text-center space-y-1">
          <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
            <i class="fas fa-user-globe"></i>
          </div>
          <h2 class="text-base font-bold text-slate-800">프로필 설정</h2>
          <p class="text-xs text-slate-500">대화방에서 사용할 국가와 별명을 선택해주세요.</p>
        </div>

        <div class="space-y-3">
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">국가 선택</label>
            <select id="modalCountry" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="🇰🇷 대한민국">🇰🇷 대한민국 (Korea)</option>
              <option value="🇺🇸 미국">🇺🇸 미국 (USA)</option>
              <option value="🇯🇵 일본">🇯🇵 일본 (Japan)</option>
              <option value="🇨🇳 중국">🇨🇳 중국 (China)</option>
              <option value="🇹🇼 대만">🇹🇼 대만 (Taiwan)</option>
              <option value="🇻🇳 베트남">🇻🇳 베트남 (Vietnam)</option>
              <option value="🇹🇭 태국">🇹🇭 태국 (Thailand)</option>
              <option value="🇬🇧 영국">🇬🇧 영국 (UK)</option>
              <option value="🇫🇷 프랑스">🇫🇷 프랑스 (France)</option>
              <option value="🇩🇪 독일">🇩🇪 독일 (Germany)</option>
              <option value="🌐 기타">🌐 기타 (Other)</option>
            </select>
          </div>

          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">별명 (닉네임)</label>
            <input type="text" id="modalNickname" placeholder="예: 대구여행자, 로컬맛집탐험가" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <button onclick="saveUserProfile()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2.5 rounded-xl shadow-md transition">
          시작하기
        </button>
      </div>
    </div>

    <!-- 1. 상단 헤더 -->
    <header class="bg-indigo-600 text-white px-4 py-3.5 shrink-0 flex justify-between items-center shadow-md w-full z-50">
      <div class="flex items-center gap-2.5 min-w-0 flex-1">
        <button id="backBtn" onclick="goBack()" class="hidden text-white hover:text-indigo-200 text-xl pr-1 shrink-0">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="min-w-0 flex-1">
          <h1 id="headerTitle" class="text-base sm:text-lg font-bold flex items-center gap-2 truncate">
            <svg class="w-5 h-6 fill-indigo-200 shrink-0" viewBox="0 0 100 140">
              <path d="M40,5 Q55,8 60,18 Q68,28 62,38 Q58,45 68,52 Q78,60 70,72 Q62,82 65,95 Q68,110 52,125 Q42,135 38,128 Q32,118 38,102 Q42,92 35,82 Q28,72 32,58 Q35,48 25,35 Q18,25 28,15 Z"/>
              <circle cx="82" cy="118" r="5"/>
              <circle cx="92" cy="55" r="3"/>
            </svg>
            <span class="truncate">Local Talk</span>
          </h1>
          <p id="headerSub" class="text-xs text-indigo-100 truncate">실시간 현지인 Q&A</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1.5 shrink-0 ml-1">
        <button onclick="openProfileModal()" class="bg-indigo-700 hover:bg-indigo-800 text-white p-1.5 px-2 rounded-full text-xs font-bold flex items-center gap-1">
          <i class="fas fa-user-circle"></i>
          <span id="headerUserLabel" class="max-w-[70px] truncate text-[10px]">설정</span>
        </button>
        <span class="text-xs text-indigo-200 font-bold">Lang:</span>
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-indigo-700 text-white text-xs font-bold py-1 px-1.5 rounded-full border border-indigo-500 focus:outline-none cursor-pointer">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh-CN">中文</option>
        </select>
      </div>
    </header>

    <!-- [화면 1] 도시 및 지역 선택 메인 화면 -->
    <main id="homeView" class="p-4 space-y-4 flex-1 scroll-area w-full pb-16">
      <div class="relative w-full">
        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400 text-sm"></i>
        <input type="text" id="citySearch" onkeyup="filterCities()" placeholder="궁금한 도시/지역을 검색하세요 (예: 서울, 대구, 여수)" class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
      </div>

      <div class="w-full">
        <h2 id="popularTitle" class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5">주요 도시 및 지역 목록</h2>
        <div id="cityList" class="flex flex-col gap-3 w-full"></div>
      </div>
    </main>

    <!-- [화면 2] 지역 게시판 메인 화면 -->
    <main id="boardView" class="hidden p-4 space-y-4 flex-1 scroll-area w-full pb-16">
      <div onclick="openChatRoomList()" class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-4 rounded-2xl shadow-md cursor-pointer flex justify-between items-center hover:opacity-95 transition">
        <div>
          <span class="bg-white/20 text-xs px-2.5 py-0.5 rounded-full font-bold">LIVE Q&A (Max 4명)</span>
          <h3 id="boardBannerTitle" class="font-bold text-base mt-1">실시간 대화방 목록</h3>
          <p id="boardBannerSub" class="text-xs text-indigo-100 mt-0.5">원하는 채팅방을 선택하여 소통해보세요</p>
        </div>
        <div class="bg-white text-indigo-600 w-10 h-10 rounded-full flex items-center justify-center text-base shadow shrink-0">
          <i class="fas fa-comments"></i>
        </div>
      </div>

      <div>
        <h3 id="boardPostsTitle" class="text-sm font-bold text-slate-700 mb-2.5 flex items-center gap-1.5">
          <i class="fas fa-bullhorn text-amber-500"></i> 필독 정보 & 지역 꿀팁
        </h3>
        <div id="boardPosts" class="space-y-2.5"></div>
      </div>
    </main>

    <!-- [화면 3] 도시별 5개 채팅방 선택 화면 -->
    <main id="roomListView" class="hidden p-4 space-y-4 flex-1 scroll-area w-full pb-16">
      <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3.5 text-xs text-indigo-800 flex items-center gap-2.5">
        <i class="fas fa-users text-indigo-500 text-sm"></i>
        <div>
          <strong id="roomListNoticeTitle" class="text-sm">실시간 Q&A 대화방 선택</strong>
          <p id="roomListNoticeSub" class="text-xs text-indigo-600 mt-0.5">쾌적한 대화를 위해 각 방당 최대 4명까지 입장 가능합니다.</p>
        </div>
      </div>

      <div id="chatRoomsContainer" class="space-y-3 w-full"></div>
    </main>

    <!-- [화면 4] 개별 채팅방 화면 -->
    <div id="chatView" class="hidden flex-1 flex-col overflow-hidden w-full relative bg-slate-50 pb-12">
      <main class="flex-1 p-4 space-y-3.5 scroll-area w-full pb-4" id="chatScrollArea">
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3.5 text-xs text-indigo-800 flex items-start gap-2.5 w-full">
          <i class="fas fa-info-circle text-indigo-500 mt-0.5 shrink-0 text-sm"></i>
          <div class="min-w-0 flex-1">
            <strong id="chatNoticeTitle" class="text-sm">현지인 Q&A 방</strong><br>
            <span id="chatNoticeSub" class="text-xs">여행 중 궁금한 점을 물어보세요! 현지 주민들이 답해드립니다.</span>
          </div>
        </div>

        <div id="messageList" class="space-y-3.5 w-full"></div>
      </main>

      <footer id="chatInputBar" class="bg-white border-t border-slate-200 px-3.5 py-2.5 flex gap-2 items-center shrink-0 z-40 w-full">
        <input type="text" id="msgInput" onkeypress="if(event.key==='Enter') sendMessage()" placeholder="질문이나 답변을 입력하세요..." class="flex-1 min-w-0 bg-slate-100 border-none rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button id="sendBtn" onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center transition shadow-sm whitespace-nowrap shrink-0">
          전송
        </button>
      </footer>
    </div>

    <!-- [화면 5] 구글 지도 화면 -->
    <main id="mapView" class="hidden flex-1 w-full h-full relative pb-12">
      <div class="absolute top-3 left-3 right-3 z-50 flex flex-col gap-1.5">
        <div class="flex gap-1.5">
          <input type="text" id="mapSearchInput" onkeypress="if(event.key==='Enter') searchGoogleMapLocation()" placeholder="장소(예: 현대, 더현대 대구)" class="flex-1 px-4 py-2.5 bg-white/95 backdrop-blur border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-md">
          <button onclick="searchGoogleMapLocation()" class="bg-indigo-600 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-md hover:bg-indigo-700 shrink-0">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>

      <div id="googleMap" class="w-full h-full min-h-[300px]"></div>
      
      <button onclick="moveToMyLocation(true)" class="absolute bottom-16 right-4 bg-white text-slate-700 p-3 rounded-full shadow-lg z-50 hover:bg-slate-50 flex items-center justify-center border border-slate-200">
        <i class="fas fa-crosshairs text-indigo-600 text-base"></i>
      </button>
    </main>

    <!-- 하단 탭 바 -->
    <nav class="bg-white border-t border-slate-200 px-6 py-2 flex justify-between items-center shrink-0 z-50 w-full">
      <button onclick="switchTab('home')" id="tabHome" class="flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition">
        <i class="fas fa-house text-lg"></i>
        <span class="text-xs">홈</span>
      </button>
      <button onclick="switchTab('map')" id="tabMap" class="flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition">
        <i class="fas fa-map-location-dot text-lg"></i>
        <span class="text-xs">지역지도</span>
      </button>
      <button onclick="switchTab('my')" id="tabMy" class="flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition">
        <i class="fas fa-user text-lg"></i>
        <span class="text-xs">My</span>
      </button>
    </nav>

  </div>

    // A stable local identifier is not authentication. Enforce permissions server-side.
    function getOrCreateLocalUserId() {
      var existing = localStorage.getItem('my_chat_uid');
      if (existing && /^user_[0-9a-f-]{36}$/i.test(existing)) return existing;
      var id = 'user_' + crypto.randomUUID();
      localStorage.setItem('my_chat_uid', id);
      return id;
    }
    var myUserId = getOrCreateLocalUserId();

    var userCountry = localStorage.getItem('my_user_country') || '';
    var userNickname = localStorage.getItem('my_user_nickname') || '';

    function checkUserProfile() {
      if (!userCountry || !userNickname) {
        openProfileModal();
      } else {
        updateHeaderUserLabel();
      }
    }

    function openProfileModal() {
      if (userCountry) document.getElementById('modalCountry').value = userCountry;
      if (userNickname) document.getElementById('modalNickname').value = userNickname;
      document.getElementById('profileModal').classList.remove('hidden');
    }

    function saveUserProfile() {
      var country = document.getElementById('modalCountry').value;
      var nick = document.getElementById('modalNickname').value.trim();

      if (!nick) {
        alert('별명을 입력해 주세요!');
        return;
      }

      userCountry = country;
      userNickname = nick;

      localStorage.setItem('my_user_country', userCountry);
      localStorage.setItem('my_user_nickname', userNickname);

      document.getElementById('profileModal').classList.add('hidden');
      updateHeaderUserLabel();

      if (currentRoomUsersRef) {
        var flagOnly = userCountry.split(' ')[0];
        currentRoomUsersRef.set({ name: flagOnly + ' ' + userNickname, joinedAt: Date.now() });
      }
    }

    function updateHeaderUserLabel() {
      var flagOnly = userCountry ? userCountry.split(' ')[0] : '🌐';
      document.getElementById('headerUserLabel').innerText = flagOnly + ' ' + userNickname;
    }

    function getFormattedMySender() {
      var flagOnly = userCountry ? userCountry.split(' ')[0] : '🌐';
      return flagOnly + ' ' + userNickname;
    }

      script.id = "googleMapsScript";

    function listenCityUsers() {
      var presenceRef = db.ref('presence');
      presenceRef.on('value', function(snapshot) {
        var data = snapshot.val() || {};
        var counts = {};

        for (var key in data) {
          var userObj = data[key];
          if (userObj && userObj.cityId) {
            counts[userObj.cityId] = (counts[userObj.cityId] || 0) + 1;
          }
        }
        renderCityList(document.getElementById('citySearch').value, counts);
      });
    }

    function renderCityList(filterKeyword, liveCounts) {
      var filter = filterKeyword || '';
      var listContainer = document.getElementById('cityList');

      listContainer.innerHTML = '';
      var t = I18N[currentLang] || I18N['ko'];

      for (var i = 0; i < CITIES.length; i++) {
        var city = CITIES[i];
        var name = getCityName(city);
        var desc = getCityDesc(city);
        var subText = city.subCities || '';
        var realCount = (liveCounts && liveCounts[city.id]) ? liveCounts[city.id] : 0;

        if (filter === '' || name.toLowerCase().indexOf(filter.toLowerCase()) !== -1 || subText.toLowerCase().indexOf(filter.toLowerCase()) !== -1) {

          : '<span class="text-xs bg-emerald-50 text-emerald-600 font-bold px-2.5 py-0.5 rounded-full border border-emerald-100">' + count + '/' + max + '명 참여 중</span>';

        var btnHtml = isFull
          ? '<button disabled class="bg-slate-200 text-slate-400 px-4 py-2 rounded-xl font-bold text-xs cursor-not-allowed">꽉참</button>'
          : '<button onclick="enterSpecificChatRoom(' + rId + ')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-bold text-xs transition shadow-sm">' + t.roomEnter + '</button>';

        var card = '<div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center w-full min-w-0">' +
          '<div class="flex items-center gap-3 min-w-0 flex-1 pr-2">' +
            '<div class="w-9 h-9 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-sm shrink-0"><i class="fas fa-hashtag"></i></div>' +
            '<div class="min-w-0 flex-1">' +
              '<h4 class="font-bold text-slate-800 text-sm truncate">Room #' + rId + '</h4>' +
              '<div class="mt-1">' + statusBadge + '</div>' +
            '</div>' +
          '</div>' +
          btnHtml +
        '</div>';

        container.innerHTML += card;
      }
    }

    function enterSpecificChatRoom(roomId) {
      if (!userCountry || !userNickname) {
        openProfileModal();
        return;
      }

      // UI-only capacity checks are not authoritative; use Firebase rules and
      // a transactional server-side admission design before public launch.
      if ((roomUserCounts[roomId] || 0) >= 4) {
        alert('정원이 가득 찬 채팅방입니다.');
        return;
      }
      stopRoomListeners();
      if (currentRoomUsersRef) {
        currentRoomUsersRef.remove();
        currentRoomUsersRef = null;
      }

      currentRoom = roomId;
      currentView = 'chat';

      var flagOnly = userCountry.split(' ')[0];
      var myDisplayName = flagOnly + ' ' + userNickname;

      currentRoomUsersRef = db.ref('rooms/' + currentCity.id + '/' + roomId + '/activeUsers/' + myUserId);
      currentRoomUsersRef.set({ name: myDisplayName, joinedAt: Date.now() });
      currentRoomUsersRef.onDisconnect().remove();

      document.getElementById('roomListView').classList.add('hidden');
      document.getElementById('mapView').classList.add('hidden');
      document.getElementById('chatView').classList.remove('hidden');
      document.getElementById('chatView').classList.add('flex');

      var cityName = getCityName(currentCity);
      var t = I18N[currentLang] || I18N['ko'];

      document.getElementById('headerTitle').innerText = cityName + ' Room #' + roomId;
      document.getElementById('chatNoticeTitle').innerText = cityName + ' Room #' + roomId + ' Q&A';
      document.getElementById('chatNoticeSub').innerText = t.noticeSub;

      listenRoomPresence();
      listenRealtimeMessages();
    }

    function stopRoomListeners() {
      if (roomPresenceListener) roomPresenceListener.off();
      if (messageListenerRef) messageListenerRef.off();
      roomPresenceListener = null;
      messageListenerRef = null;
    }

    function listenRoomPresence() {
      if (roomPresenceListener) roomPresenceListener.off();

      var roomRef = db.ref('rooms/' + currentCity.id + '/' + currentRoom);
      roomPresenceListener = roomRef.child('activeUsers');

      roomPresenceListener.on('value', function(snapshot) {
        var usersData = snapshot.val() || {};
        var userCount = Object.keys(usersData).length;
        
        var cityName = getCityName(currentCity);
        document.getElementById('headerSub').innerText = '👥 현재 ' + userCount + '명 참여 중';

        // Do not delete all messages from a presence callback. A trusted
        // backend retention job should handle any intended expiry policy.
      });
    }

    function listenRealtimeMessages() {
      if (messageListenerRef) messageListenerRef.off();
      var msgsRef = db.ref('rooms/' + currentCity.id + '/' + currentRoom + '/messages');
      messageListenerRef = msgsRef;
      msgsRef.on('value', function(snapshot) {
        var data = snapshot.val() || {};
        var msgList = [];
        for (var k in data) {
          msgList.push(data[k]);
        }
        renderMessages(msgList);
      });
    }

    function renderGoogleMap() {
      if (typeof google === 'undefined' || !google.maps) {
        loadGoogleMapsScript(currentLang, renderGoogleMap);
        return;
      }

      var centerLat = currentCity ? currentCity.lat : (userLatLng ? userLatLng.lat : 36.3);
      var centerLng = currentCity ? currentCity.lng : (userLatLng ? userLatLng.lng : 127.8);
      var zoomLevel = currentCity ? 12 : (userLatLng ? 14 : 7);
      var t = I18N[currentLang] || I18N['ko'];

      var mapOptions = {
        center: { lat: centerLat, lng: centerLng },
        zoom: zoomLevel,
        mapTypeControl: false,
        streetViewControl: false
      };

      googleMapInstance = new google.maps.Map(document.getElementById("googleMap"), mapOptions);
      googleMapMarkers = [];

      for (var j = 0; j < CITIES.length; j++) {
        var c = CITIES[j];
        var cName = getCityName(c);

        var marker = new google.maps.Marker({
          position: { lat: c.lat, lng: c.lng },
          map: googleMapInstance,
          title: cName
        });

        var infowindow = new google.maps.InfoWindow({
          content: '<div style="padding:6px; font-size:12px; font-weight:bold; text-align:center;">' +
            cName + '<br><span style="font-size:11px; color:#4f46e5; cursor:pointer;" onclick="openCityBoard(\'' + c.id + '\')">' + t.mapQaLink + '</span>' +
          '</div>'
        });

        (function(m, iw) {
          m.addListener("click", function() {
            iw.open(googleMapInstance, m);
          });
        })(marker, infowindow);

        googleMapMarkers.push(marker);
      }

      moveToMyLocation(false);
    }

    function searchGoogleMapLocation() {
      var query = document.getElementById('mapSearchInput').value.trim();
      if (!query || !googleMapInstance) return;

      for (var i = 0; i < searchMarkers.length; i++) {
        searchMarkers[i].setMap(null);
      }
      searchMarkers = [];

      var targetText = query;
      if (query === "현대") targetText = "더현대 대구";

      var geocoder = new google.maps.Geocoder();
      var geocodeOptions = { address: targetText };
      if (userLatLng) geocodeOptions.location = userLatLng;

      geocoder.geocode(geocodeOptions, function(results, status) {
        if (status === "OK" && results[0]) {
          var loc = results[0].geometry.location;
          var placeName = results[0].formatted_address || targetText;

          googleMapInstance.setCenter(loc);
          googleMapInstance.setZoom(16);

          var sMarker = new google.maps.Marker({
            map: googleMapInstance,
            position: loc,
            title: placeName,
            animation: google.maps.Animation.DROP
          });

          var encodedQuery = encodeURIComponent(targetText);
          var naverMapUrl = "https://m.map.naver.com/search2/search.naver?query=" + encodedQuery;
          var kakaoMapUrl = "https://m.map.kakao.com/actions/searchView?q=" + encodedQuery;

          var windowContent = '<div style="padding:8px; font-size:13px; font-family:sans-serif; max-width:220px;">' +
            '<strong style="color:#1e293b; font-size:14px; display:block; margin-bottom:4px;">📍 ' + targetText + '</strong>' +
            '<span style="color:#64748b; font-size:11px; display:block; margin-bottom:8px; line-height:1.2;">' + placeName + '</span>' +
            '<div style="display:flex; flex-direction:column; gap:6px;">' +
              '<a href="' + naverMapUrl + '" target="_blank" style="text-align:center; background:#03C75A; color:white; text-decoration:none; padding:8px; border-radius:8px; font-size:12px; font-weight:bold; display:block;">' +
                '🧭 네이버 지도로 길찾기' +
              '</a>' +
              '<a href="' + kakaoMapUrl + '" target="_blank" style="text-align:center; background:#FEE500; color:#191919; text-decoration:none; padding:8px; border-radius:8px; font-size:12px; font-weight:bold; display:block;">' +
                '💛 카카오맵으로 길찾기' +
              '</a>' +
            '</div>' +
          '</div>';

          var sInfoWindow = new google.maps.InfoWindow({
            content: windowContent
          });

          sMarker.addListener("click", function() {
            sInfoWindow.open(googleMapInstance, sMarker);
          });

          sInfoWindow.open(googleMapInstance, sMarker);
          searchMarkers.push(sMarker);
        } else {
          alert("장소를 찾을 수 없습니다. (예: 더현대 대구, 반월당역)");
        }
      });
    }

    function moveToMyLocation(shouldPan) {
      var panToUser = (shouldPan !== undefined) ? shouldPan : true;

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          var lat = position.coords.latitude;
          var lng = position.coords.longitude;
          userLatLng = { lat: lat, lng: lng };

          if (myLocationMarker) {
            myLocationMarker.setMap(null);
          }

          if (typeof google !== 'undefined' && google.maps) {
            myLocationMarker = new google.maps.Marker({
              position: userLatLng,
              map: googleMapInstance,
              title: "My Location",
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 9,
                fillColor: "#ef4444",
                fillOpacity: 1,
                strokeColor: "#ffffff",
                strokeWeight: 2
              }
            });

            if (panToUser && googleMapInstance) {
              googleMapInstance.setCenter(userLatLng);
              googleMapInstance.setZoom(14);
            }
          }
        }, function(error) {
          if (panToUser) {
            alert("위치 정보를 가져올 수 없습니다. 브라우저 위치 접근을 허용해 주세요.");
          }
        });
      }
    }

    function goBack() {
      if (currentView === 'chat') {
        var leaveConfirm = confirm("채팅방을 나가시겠습니까?\n나가시면 이전 대화 내용은 초기화될 수 있습니다.");
        if (!leaveConfirm) return;

        stopRoomListeners();
        if (currentRoomUsersRef) {
          currentRoomUsersRef.remove();
          currentRoomUsersRef = null;
        }
        openChatRoomList();
      } else if (currentView === 'roomList') {
        openCityBoard(currentCity.id);
      } else {
        currentCity = null;
        currentRoom = null;
        currentView = 'home';

        document.getElementById('homeView').classList.remove('hidden');
        document.getElementById('boardView').classList.add('hidden');
        document.getElementById('roomListView').classList.add('hidden');
        document.getElementById('chatView').classList.add('hidden');
        document.getElementById('mapView').classList.add('hidden');
        document.getElementById('chatView').classList.remove('flex');
        
        document.getElementById('backBtn').classList.add('hidden');

        var t = I18N[currentLang] || I18N['ko'];
        
        document.getElementById('headerTitle').innerHTML = '<svg class="w-5 h-6 fill-indigo-200 shrink-0" viewBox="0 0 100 140"><path d="M40,5 Q55,8 60,18 Q68,28 62,38 Q58,45 68,52 Q78,60 70,72 Q62,82 65,95 Q68,110 52,125 Q42,135 38,128 Q32,118 38,102 Q42,92 35,82 Q28,72 32,58 Q35,48 25,35 Q18,25 28,15 Z"/><circle cx="82" cy="118" r="5"/><circle cx="92" cy="55" r="3"/></svg><span class="truncate">Local Talk</span>';
        document.getElementById('headerSub').innerText = t.appSub;
      }
    }

    function switchTab(tabName) {
      var tHome = document.getElementById('tabHome');
      var tMap = document.getElementById('tabMap');
      var tMy = document.getElementById('tabMy');

      tHome.className = "flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition";
      tMap.className = "flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition";
      tMy.className = "flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition";

      if (tabName === 'home') {
        tHome.className = "flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition";
        goBack();
      } else if (tabName === 'map') {
        tMap.className = "flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition";
        currentView = 'map';

        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('boardView').classList.add('hidden');
        document.getElementById('roomListView').classList.add('hidden');
        document.getElementById('chatView').classList.add('hidden');
        document.getElementById('mapView').classList.remove('hidden');

        document.getElementById('backBtn').classList.remove('hidden');

        var t = I18N[currentLang] || I18N['ko'];
        document.getElementById('headerTitle').innerText = t.mapTitle;
        document.getElementById('headerSub').innerText = t.mapSub;

        loadGoogleMapsScript(currentLang, renderGoogleMap);
      } else if (tabName === 'my') {
        tMy.className = "flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition";
        openProfileModal();
      }
    }

    // All user-controlled content is inserted as text, never parsed as HTML.
    function renderMessages(msgs) {
      var container = document.getElementById('messageList');
      container.replaceChildren();
      var t = I18N[currentLang] || I18N['ko'];
      if (!msgs || msgs.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'text-center py-10 text-slate-400 text-xs';
        empty.textContent = t.noMsg;
        container.appendChild(empty);
        return;
      }
      msgs.forEach(function(m) {
        if (!m || typeof m !== 'object') return;
        if (m.isSystem && m.uid === myUserId) return;
        if (m.isSystem) {
          var sysWrap = document.createElement('div');
          sysWrap.className = 'flex justify-center my-1 w-full';
          var sysText = document.createElement('span');
          sysText.className = 'bg-slate-200/80 text-slate-600 text-xs px-3.5 py-1 rounded-full font-bold';
          sysText.textContent = '💬 ' + String(m.text || '');
          sysWrap.appendChild(sysText);
          container.appendChild(sysWrap);
          return;
        }
        var mine = m.uid === myUserId;
        var wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col w-full ' + (mine ? 'items-end' : 'items-start');
        var sender = document.createElement('span');
        sender.className = 'text-xs font-bold text-slate-500 px-1 mb-0.5';
        sender.textContent = mine ? getFormattedMySender() + ' (나)' : String(m.sender || '');
        wrapper.appendChild(sender);
        var bubble = document.createElement('div');
        bubble.className = 'max-w-[82%] rounded-2xl p-3 text-xs sm:text-sm leading-relaxed chat-bubble ' +
          (mine ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 shadow-sm rounded-tl-none');
        var message = document.createElement('div');
        message.textContent = String(m.text || '');
        bubble.appendChild(message);
        if (m.trans) {
          var translation = document.createElement('div');
          translation.className = 'mt-1.5 pt-1.5 border-t text-xs font-medium chat-bubble ' +
            (mine ? 'border-indigo-400/50 text-amber-200' : 'border-slate-200 text-indigo-700');
          translation.textContent = String(m.trans);
          bubble.appendChild(translation);
        }
        wrapper.appendChild(bubble);
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'mt-1 text-xs text-indigo-600 font-bold hover:underline block';
        button.textContent = '[번역하기]';
        button.addEventListener('click', function() { translateMsg(m.id, String(m.text || '')); });
        wrapper.appendChild(button);
        var time = document.createElement('span');
        time.className = 'text-[10px] text-slate-400 px-1 mt-0.5';
        time.textContent = String(m.time || '');
        wrapper.appendChild(time);
        container.appendChild(wrapper);
      });
      var scrollArea = document.getElementById('chatScrollArea');
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    function translateMsg(msgId, text) {
      var targetLang = currentLang;
      if (currentLang === 'ko') {
        var hasKorean = /[가-힣]/.test(text);
        targetLang = hasKorean ? 'en' : 'ko';
      }

      var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + targetLang + '&dt=t&q=' + encodeURIComponent(text);

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && data[0]) {
            var fullTrans = '';
            for (var i = 0; i < data[0].length; i++) {
              if (data[0][i][0]) fullTrans += data[0][i][0];
            }
            db.ref('rooms/' + currentCity.id + '/' + currentRoom + '/messages/' + msgId + '/trans').set('[번역] ' + fullTrans);
          }
        })
        .catch(function(err) {
          alert('번역 실패: 인터넷 연결을 확인해 주세요.');
        });
    }

    function sendMessage() {
      var input = document.getElementById('msgInput');
      var text = input.value.trim();
      if (!text || !currentCity || !currentRoom) return;
      if (text.length > 2000) {
        alert('메시지는 2,000자 이하로 입력해 주세요.');
        return;
      }

      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      var timeStr = (hours >= 12 ? 'PM' : 'AM') + ' ' + (hours % 12 || 12) + ':' + (minutes < 10 ? '0' : '') + minutes;

      var flagOnly = userCountry ? userCountry.split(' ')[0] : '🌐';
      var myDisplayName = flagOnly + ' ' + userNickname;

      var newMsgRef = db.ref('rooms/' + currentCity.id + '/' + currentRoom + '/messages').push();
      newMsgRef.set({
        id: newMsgRef.key,
        uid: myUserId,
        sender: myDisplayName,
        text: text,
        time: timeStr
      });

      input.value = '';
      input.focus();
    }

    function changeLanguage(lang) {
      currentLang = lang;
      var t = I18N[currentLang] || I18N['ko'];

      document.getElementById('headerSub').innerText = t.appSub;
      document.getElementById('citySearch').placeholder = t.searchPlaceholder;
      document.getElementById('popularTitle').innerText = t.popularTitle;
      document.getElementById('msgInput').placeholder = t.inputPlaceholder;
      document.getElementById('sendBtn').innerText = t.send;

      if (currentCity) {
        var cityName = getCityName(currentCity);
        if (currentView === 'board') {
          document.getElementById('headerTitle').innerText = cityName + t.boardTitleSuffix;
          document.getElementById('headerSub').innerText = t.boardSub;
          document.getElementById('boardBannerTitle').innerText = cityName + t.boardBannerSuffix;
          document.getElementById('boardBannerSub').innerText = t.boardBannerSub;
          document.getElementById('boardPostsTitle').innerHTML = t.boardPostsTitle;
          renderBoardPosts();
        } else if (currentView === 'roomList') {
          document.getElementById('headerTitle').innerText = cityName + t.roomListTitle;
          renderChatRooms();
        } else if (currentView === 'chat') {
          document.getElementById('headerTitle').innerText = cityName + ' Room #' + currentRoom;
          document.getElementById('chatNoticeTitle').innerText = cityName + ' Room #' + currentRoom + ' Q&A';
          document.getElementById('chatNoticeSub').innerText = t.noticeSub;
        }
      }

      if (currentView === 'map') {
        document.getElementById('headerTitle').innerText = t.mapTitle;
        document.getElementById('headerSub').innerText = t.mapSub;
        loadGoogleMapsScript(currentLang, renderGoogleMap);
      }

      renderCityList(document.getElementById('citySearch').value);
    }

    function filterCities() {
      var query = document.getElementById('citySearch').value;
      renderCityList(query);
    }

    checkUserProfile();
    listenCityUsers();
  </script>
</body>
