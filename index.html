<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Korea Local Talk - 대한민국 실시간 현지인 Q&A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=e02il5rppk"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 900px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 640px) {
      .app-container {
        max-width: 100% !important;
        max-height: 100% !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
    }

    .scroll-area {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    .chat-bubble { 
      word-break: break-all !important; 
      overflow-wrap: anywhere !important; 
    }
  </style>
</head>
<body>

  <div class="app-container sm:rounded-[36px] border-slate-700 sm:border-[8px]">

    <!-- 1. 상단 헤더 -->
    <header class="bg-indigo-600 text-white px-3.5 py-3 shrink-0 flex justify-between items-center shadow-md w-full z-50">
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <button id="backBtn" onclick="goBack()" class="hidden text-white hover:text-indigo-200 text-lg pr-1 shrink-0">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="min-w-0 flex-1">
          <h1 id="headerTitle" class="text-sm sm:text-base font-bold flex items-center gap-1.5 truncate">
            <svg class="w-4 h-5 fill-indigo-200 shrink-0" viewBox="0 0 100 140">
              <path d="M40,5 Q55,8 60,18 Q68,28 62,38 Q58,45 68,52 Q78,60 70,72 Q62,82 65,95 Q68,110 52,125 Q42,135 38,128 Q32,118 38,102 Q42,92 35,82 Q28,72 32,58 Q35,48 25,35 Q18,25 28,15 Z"/>
              <circle cx="82" cy="118" r="5"/>
              <circle cx="92" cy="55" r="3"/>
            </svg>
            <span class="truncate">Korea Local Talk</span>
          </h1>
          <p id="headerSub" class="text-[10px] text-indigo-100 truncate">대한민국 실시간 현지인 Q&A</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1 shrink-0 ml-1">
        <button id="refreshBtn" onclick="loadMessages()" class="hidden bg-indigo-700 hover:bg-indigo-800 text-white p-1.5 rounded-full text-xs font-bold items-center justify-center mr-0.5">
          <i class="fas fa-sync-alt text-[10px]" id="refreshIcon"></i>
        </button>
        <span class="text-[10px] text-indigo-200 font-bold">Language:</span>
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-indigo-700 text-white text-[10px] font-bold py-1 px-1.5 rounded-full border border-indigo-500 focus:outline-none cursor-pointer">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh-CN">中文</option>
        </select>
      </div>
    </header>

    <!-- [화면 1] 도시 선택 메인 화면 -->
    <main id="homeView" class="p-4 space-y-3.5 flex-1 scroll-area w-full pb-16">
      <div class="relative w-full">
        <i class="fas fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="citySearch" onkeyup="filterCities()" placeholder="궁금한 도시를 검색하세요 (예: 서울, 제주, 부산)" class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
      </div>

      <div class="w-full">
        <h2 id="popularTitle" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">대한민국 주요 도시 목록</h2>
        <div id="cityList" class="grid grid-cols-2 gap-2.5 w-full"></div>
      </div>
    </main>

    <!-- [화면 2] 지역 게시판 메인 화면 -->
    <main id="boardView" class="hidden p-4 space-y-3.5 flex-1 scroll-area w-full pb-16">
      <div onclick="openChatRoomList()" class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-3.5 rounded-2xl shadow-md cursor-pointer flex justify-between items-center hover:opacity-95 transition">
        <div>
          <span class="bg-white/20 text-[10px] px-2 py-0.5 rounded-full font-bold">LIVE Q&A (Max 4명)</span>
          <h3 id="boardBannerTitle" class="font-bold text-sm mt-1">서울 실시간 대화방 목록</h3>
          <p id="boardBannerSub" class="text-[11px] text-indigo-100 mt-0.5">원하는 채팅방을 선택하여 소통해보세요</p>
        </div>
        <div class="bg-white text-indigo-600 w-9 h-9 rounded-full flex items-center justify-center text-sm shadow shrink-0">
          <i class="fas fa-comments"></i>
        </div>
      </div>

      <div>
        <h3 id="boardPostsTitle" class="text-xs font-bold text-slate-600 mb-2 flex items-center gap-1">
          <i class="fas fa-bullhorn text-amber-500"></i> 필독 정보 & 지역 꿀팁
        </h3>
        <div id="boardPosts" class="space-y-2"></div>
      </div>
    </main>

    <!-- [화면 3] 도시별 5개 채팅방 선택 화면 -->
    <main id="roomListView" class="hidden p-4 space-y-3.5 flex-1 scroll-area w-full pb-16">
      <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 text-xs text-indigo-800 flex items-center gap-2">
        <i class="fas fa-users text-indigo-500"></i>
        <div>
          <strong id="roomListNoticeTitle">실시간 Q&A 대화방 선택</strong>
          <p id="roomListNoticeSub" class="text-[10px] text-indigo-600">쾌적한 대화를 위해 각 방당 최대 4명까지 입장 가능합니다.</p>
        </div>
      </div>

      <div id="chatRoomsContainer" class="space-y-2.5 w-full"></div>
    </main>

    <!-- [화면 4] 개별 채팅방 화면 -->
    <div id="chatView" class="hidden flex-1 flex-col overflow-hidden w-full relative bg-slate-50 pb-12">
      <main class="flex-1 p-3.5 space-y-3 scroll-area w-full pb-4" id="chatScrollArea">
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 text-xs text-indigo-800 flex items-start gap-2 w-full">
          <i class="fas fa-info-circle text-indigo-500 mt-0.5 shrink-0 text-xs"></i>
          <div class="min-w-0 flex-1">
            <strong id="chatNoticeTitle" class="text-xs">서울 현지인 Q&A 방</strong><br>
            <span id="chatNoticeSub" class="text-[11px]">여행 중 궁금한 점을 물어보세요! 현지 주민들이 답해드립니다.</span>
          </div>
        </div>

        <div id="messageList" class="space-y-3 w-full"></div>
      </main>

      <footer id="chatInputBar" class="bg-white border-t border-slate-200 px-3 py-2 flex gap-2 items-center shrink-0 z-40 w-full">
        <input type="text" id="msgInput" onkeypress="if(event.key==='Enter') sendMessage()" placeholder="질문이나 답변을 입력하세요..." class="flex-1 min-w-0 bg-slate-100 border-none rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button id="sendBtn" onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl font-bold text-xs flex items-center justify-center transition shadow-sm whitespace-nowrap shrink-0">
          전송
        </button>
      </footer>
    </div>

    <!-- [화면 5] 네이버 지도 실시간 연동 화면 -->
    <main id="mapView" class="hidden flex-1 w-full h-full relative pb-12">
      <div id="naverMap" class="w-full h-full"></div>
    </main>

    <!-- 하단 탭 바 (Bottom Navigation) -->
    <nav class="bg-white border-t border-slate-200 px-6 py-2 flex justify-between items-center shrink-0 z-50 w-full">
      <button onclick="switchTab('home')" id="tabHome" class="flex flex-col items-center gap-0.5 text-indigo-600 font-bold transition">
        <i class="fas fa-house text-base"></i>
        <span class="text-[10px]">홈</span>
      </button>
      <button onclick="switchTab('map')" id="tabMap" class="flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition">
        <i class="fas fa-map-location-dot text-base"></i>
        <span class="text-[10px]">지역지도</span>
      </button>
      <button onclick="switchTab('my')" id="tabMy" class="flex flex-col items-center gap-0.5 text-slate-400 font-medium hover:text-indigo-600 transition">
        <i class="fas fa-user text-base"></i>
        <span class="text-[10px]">My</span>
      </button>
    </nav>

  </div>
